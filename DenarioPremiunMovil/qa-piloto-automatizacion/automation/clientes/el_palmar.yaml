# ── Estados por módulo ────────────────────────────────────────────────────────
# 🔴🔴 ADVERTENCIA CRÍTICA PARA EL COTEJO BD: en esta playa el `st_*` de la
#     transacción **NO es traducible por el catálogo `statuses`**.
#     ✅ RECONFIRMADO 2026-08-05 sobre los **25 cobros verificados** (27068-27092):
#        los 25 tienen `st_collection = 1`, valor inexistente en el catálogo `cob`
#        de AMBAS empresas. La fuente confiable es `transaction_statuses` con
#        **co_status='env'** (ver abajo). Vale para todos los módulos de esta playa.
#     Los cobros que QA envió hoy tienen `collection.st_collection = 1`,
#     y el valor 1 **NO EXISTE** en el catálogo `cob` de NINGUNA de las dos
#     empresas (1002 tiene 2 y 12; 1003 tiene 7, 22 y 17).
#     Distribución real de la tabla `collection`: st=1 → 22 filas · st=6 → 26.241.
#     Ninguno de los dos coincide con el catálogo `cob`.
#     ⇒ NO derivar "Enviado" haciendo JOIN de st_collection contra statuses.
#
# ✅ LA FUENTE CONFIABLE ES `transaction_statuses` (log de estado por transacción),
#    donde lo que importa es **co_status**, no id_status:
#      cob: co_status='env' (id_status 1 → 2.468 · 2 → 194 · 7 → 50)
#      ped: co_status='env' (id_status 1 → 2.447)
#      dev: co_status='env' (id_status 3 → 3)
#      inv: co_status='env' (id_status 4 → 2 · 9 → 1)
#      dep: co_status='env' (id_status 5 → 2)
#    Nótese que id_status=1 aparece tanto en 'cob' como en 'ped' ⇒ el id NO es
#    discriminante; usar co_status.
#
# ✅ 'Por aprobar' (pap) NUNCA se usa en la práctica: `transaction_types` tiene
#    require_approval=false para los 6 tipos (ped, cob, dev, inv, dep, vis).
#
# Catálogo `statuses` (POR EMPRESA — se deja como referencia, NO para traducir):
#   EMPRESA 1002: ped 1=env/11=pap · cob 2=env/12=pap · dev 3=env/13=pap ·
#                 inv 4=env/14=pap · dep 5=env/15=pap      (status_action=3)
#   EMPRESA 1003: ped 6=env/16=pap/21=env · cob 7=env/17=pap/22=env ·
