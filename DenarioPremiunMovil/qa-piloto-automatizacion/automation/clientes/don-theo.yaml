# don-theo/perfil.yaml
# Cliente NUEVO — VGs derivadas del dump global_configuration_don_theo_062026.csv (2026-06-12).
# Datos de prueba por módulo (modules.*) aún SIN confirmar: se descubren en la 1ª corrida y se consolidan al cierre.
# Servidor: Isla Coche (mismo host que insumar). Panel admin web: http://denarioislacoche.ddns.net:8080/DenarioPremium/

cliente_id: don-theo
cliente_nombre: "COMERCIALIZADORA HNOS TORRES 2017, C.A."   # Confirmado por QA 2026-06-12
ws_url: "http://denarioislacoche.ddns.net:8081/PremiumWS/services/"  # endpoint del web service (app); derivado del host Isla Coche; verificar si responde
apk_package: com.kiberno.denarioPremiumPro
db_name: don_theo                          # base de este cliente para el Agente 12 / oráculo BD. La conexión completa (host+user+clave read-only) vive en el bloque "# Cliente: don-theo" de secrets/qa-db.env. OJO: los servidores/playas VARÍAN (dev los remonta) — el host autoritativo es el del secret, NO se asume fijo. Read-only confirmado en don_theo 2026-06-15. GRANT en Postgres es POR-BASE: cada cliente nuevo requiere su propio GRANT.

# ── VGs — confirmadas desde CSV 2026-06-12 (salvo esVendedor, ver nota) ──────────
vgs:
  multiCurrency: true                       # CSV multiCurrency=true
  expirationBatch: true                     # CSV expirationBatch=true → lote+fecha en inventarios
  suggestedOrder: true                      # CONFIRMADO QA 2026-06-12: ESTA es la VG que gobierna el "Pedido Sugerido" visible en Inventarios (tab Resumen). CSV suggestedOrder=true (P,23).
  suggestedOrderByDispatchAndReturn: false  # CSV=false. RESUELTO 2026-06-12: don-theo usa suggestedOrder (arriba), NO esta VG. El "Pedido Sugerido" activo NO contradice este false — son VGs distintas. Dejar en false.
  requiredCollectionAttachments: false      # CSV requiredCollectionAttachments=false → cobro NO requiere adjunto; DM-COB-019 no se salta
  requiredComment: false                    # CSV requiredComment=false → DM-COB-006 N/A
  validateReturn: false                     # CSV validateReturn=false → tabs devoluciones sin validar factura. OJO: requeridedNroFactura=true (nro factura es campo obligatorio, pero NO se valida contra factura enviada); multiInvoices=false
  signatureReturn: true                     # CSV signatureReturn=true
  signatureCollection: true                 # CSV signatureCollection=true
  signatureVisit: true                      # CSV signatureVisit=true
  userCanUploadFiles: true                  # CSV userCanUploadFiles=true
  esVendedor: true                          # Confirmado por QA 2026-06-12: usuario QA (003) es vendedor → módulo Vendedores aplica. (No viene en el dump global)
  enterpriseEnabled: true                   # CSV enterpriseEnabled=true
  enabledManualRate: false                  # CSV enabledManualRate=false. OJO: canChangeRate=true + historicoTasa=true → Fecha tasa editable (ver cobros.fecha_tasa_editable)
  cobroPrepago: true                        # CSV cobroPrepago=true → DM-COB-028 aplica (requiere cliente elegible; descubrir en corrida)
  cobroRetencion: false                     # CSV cobroRetencion=false → botón +RETENCIÓN del menú NO disponible → DM-COB-029 N/A
  retencion: false                          # CSV retencion=false → detalle de documento SIN campos retención → DM-COB-041/042 N/A
  sizeRetention: 16                          # CSV sizeRetention=16 (N/A operativamente: retencion=false)
  formatRetention: "0"                       # CSV formatRetention="0" (N/A operativamente: retencion=false)
  userCanSelectIGTF: false                  # CSV userCanSelectIGTF=false → sin selector IGTF → DM-COB-044/045 N/A
  userCanCollectIva: false                  # CSV userCanCollectIva=false → DM-COB-037 (cobro 25% IVA) N/A
  transportRole: false                      # CSV transportRole=false
  userMustActivateGPS: true                 # CSV userMustActivateGPS=true → obligar GPS activo para transacciones

