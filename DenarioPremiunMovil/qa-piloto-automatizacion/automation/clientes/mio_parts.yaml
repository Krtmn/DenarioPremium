# mio_parts/perfil.yaml
# Cliente NUEVO — VGs derivadas de los dumps `global_configuration_*_MIO PARTS.md` (2026-08-31 18:22).
# Datos de prueba tomados de la BD del cliente el 2026-08-31 (no de una corrida previa: perfil de estreno).
# APK 6.6.21.3 instalado 2026-08-31 18:16 · rama main.

cliente_id: mio_parts
cliente_nombre: "MIO LUBRICANTES Y FILTROS, CA"   # BD: enterprise.na_enterprise · co_enterprise=MIOP_ADM
# ws_url / playa: NO se registran — es propiedad del SERVIDOR, rotativa, se descubre en runtime.
# (Al 31/08 estaba en El Yaque, pero eso caduca en días: ver _schema.yaml.)
apk_package: com.kiberno.denarioPremiumPro
db_name: mio_parts        # bloque "# Cliente: mio_parts" de secrets/qa-db.env · GRANT read-only verificado 2026-08-31
                          # Empresa ÚNICA: id_enterprise=1 / co_enterprise="MIOP_ADM"

# ── VGs — leídas de los dumps del 2026-08-31 ─────────────────────────────────
# 🔑 DIFERENCIAS QUE CAMBIAN LA COBERTURA (vs piercar, el perfil más reciente):
#   - validateReturn=FALSE            → devoluciones TIPO A: el CLIENTE habilita las
#                                       tabs; NO hay paso de factura. (piercar era TIPO B)
#   - requiredCollectionAttachments=FALSE → los cobros SÍ se pueden enviar sin adjunto
#   - enterpriseEnabled=TRUE          → aparece el campo Empresa en los módulos
#   - userMustActivateGPS=TRUE        → GPS OBLIGATORIO: conceder permisos antes de correr
#   - userCanSelectIGTF=FALSE         → sin selector de IGTF
#   - multiInvoices=FALSE             → una sola factura por devolución
vgs:
  multiCurrency: true
  multiCurrencyCollection: true
  multiCurrencyDeposit: true
  clientStock: true
  suggestedOrder: true
  expirationBatch: true                     # ⚠ true en config: el modal de inventario debe pedir Lote+Fecha
  requiredCollectionAttachments: false      # ⇒ cobros ENVIABLES sin adjunto (a diferencia de piercar)
  validateReturn: false                     # 🔑 TIPO A en devoluciones: el cliente habilita las tabs
  requeridedNroFactura: true                # nro. de factura obligatorio POR PRODUCTO en devoluciones
  multiInvoices: false                      # una sola factura por devolución
  signatureReturn: true
  signatureCollection: true
  signatureVisit: false                     # ⚠ visitas NO pide firma en este cliente
  userCanUploadFiles: true
  showCamera: true
  enterpriseEnabled: true                   # 🔑 campo Empresa presente en los módulos
  userMustActivateGPS: true                 # 🔑 GPS obligatorio para transacciones
  infoVendedores: false
  cobroPrepago: true
  automatedPrepaid: true
  prepaidCurrency: "USD"                    # el anticipo automático se genera en USD
  cobroRetencion: true
  retencion: true
  sizeRetention: 14                         # nro. de comprobante de retención = 14 dígitos
  userCanAddRetention: true
  userCanSelectIGTF: false                  # ⇒ casos de IGTF N/A
  userCanCollectIva: false                  # ⇒ cobro 25% IVA N/A
  enablePartialPayment: true
  tolerancia0: true
  colletionPayment: "true-false-true-true-false-true"
  # ⚠ NO deducir qué métodos hay por el orden alfabético del catálogo: en piercar el
  #   `false` NO correspondía al que sugería el orden. Medir en la UI. [prc-20260831]

