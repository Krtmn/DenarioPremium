# ── Reparto de modelos por módulo (optimización de tiempo/costo — QA 2026-07-08) ──
# Objetivo: bajar las ~3h de corrida. Módulos NO transaccionales (no cotejan BD) → Haiku (rápido/barato).
# Módulos transaccionales (crean documento + cotejo BD round-trip, oráculo v2) → Opus.
# Clasificación por presencia de sección "Verificación BD" en automation/smoke/*.md (verificado 2026-07-08).
model_by_module:
  haiku:                                    # NO transaccionales — sin cotejo BD
    - login                                 # solo autenticación/validaciones UI
    - productos                             # solo navegación/búsqueda de catálogo (no crea documento)
    - vendedores                            # solo visualización de KPIs (infoVendedores=true, no crea documento)
  opus:                                     # transaccionales — con cotejo BD (crean/sincronizan documento)
    - clientes                              # crea cliente potencial (potentialclient) → cotejo BD
    - pedidos                               # crea pedido (order) → cotejo BD
    - cobros                                # crea cobro/anticipo/retención → cotejo BD (co_type-aware)
    - inventarios                           # toma de inventario en cliente (clientStock) → cotejo BD  ⚠ clientStock=false → probable N/A; si N/A no consume tiempo
    - devoluciones                          # crea devolución (return) → cotejo BD
    - depositos                             # crea depósito (deposit) → cotejo BD
    - visitas                               # crea visita (visit) → cotejo BD

# ── Estados de sincronización (nube osoroma, tabla statuses) ──────────────────────
