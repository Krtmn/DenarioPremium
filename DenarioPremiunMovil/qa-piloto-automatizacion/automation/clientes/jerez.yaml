# jerez/jerez.yaml
# Cliente NUEVO: JEREZ — 1ª corrida (sin datos de prueba confirmados todavía).
#
# VGs pobladas desde el CSV de configuración del equipo de DESARROLLO (misma carpeta):
#   automation/clientes/jerez/global_configuration_jerez.csv  (snapshot 2026; G/P/C, ~165 filas)
# Las llaves coinciden 1:1 con globalConfig.get("<clave>") del código.
# Decisión QA (2026-06-17): la fuente efectiva de VGs es global_configuration_jerez.csv (2026).
#   El segundo archivo global_configuration_client_jerez.csv (2022, parcial) NO se usa: es un seed antiguo.
#
# ⚠ 1ª corrida: los datos de prueba (cliente/factura/estructura/producto) están en TBD.
#   El agente debe DESCUBRIRLOS navegando las listas durante la corrida y reportarlos
#   para consolidarlos en este YAML al cierre.
# ⚠ El agente debe VERIFICAR las VGs contra la UI y MARCAR DISCREPANCIAS (CSV dev vs app = posible bug de config).

cliente_id: jerez
# [jerez-2026-06-22] HOME no muestra rótulo de empresa/cliente ni selector de empresa post-login (igual gmp/cf).
# [jerez-2026-07-06] NOMBRES REALES de empresa (nuevo set de datos, verificados en Clientes/Devoluciones/Productos/Vendedores/Depósitos):
#   idEnterprise 1 = "INV JEREZ MOTORS VALERA"  (coEnterprise 00001, coCurrencyDefault USD, enterpriseDefault:true)
#   idEnterprise 2 = "INV JEREZ MOTORS CARACAS" (coEnterprise 00002)
#   idEnterprise 3 = "INV JEREZ MOTORS TURMEREMO" (coEnterprise 00003)
#   Reemplazan los rótulos genéricos previos "INVERSIONES JEREZ MO..." [jerez-2026-06-22] y "INVERSIONES JEREZ 1/2/3" [jerez-2026-07-01].
cliente_nombre: "INV JEREZ MOTORS VALERA"   # [jerez-2026-07-06] empresa default idEnterprise:1 (USD). 3 empresas multi-empresa VALERA/CARACAS/TURMEREMO.
# ws_url / playa: NO se registran — es propiedad del SERVIDOR, es rotativa y se descubre en runtime (ver _schema.yaml).
apk_package: com.kiberno.denarioPremiumPro

# ── VGs (fuente: CSV dev global_configuration_jerez.csv 2026; VERIFICAR vs UI en corrida) ──
vgs:
  # Globales
  multiCurrency: true                    # [csv] id10
  userMustActivateGPS: true              # [csv] id7 — conceder permisos ubicación antes de la corrida
  userCanSaveGPS: true                   # [csv] id8
  enterpriseEnabled: true                # [csv] id9
  showCamera: true                       # [csv]
  userCanUploadFiles: true               # [csv] id18 — acordeón Archivo/Adjuntos
  longitudComentario: 200                # [csv]
  tagRif: "RIF"                          # [csv]
  tagIVA: "IVA"                          # [csv]
  parteDecimal: 2                        # [csv]
  transportRole: true                    # [csv] no observable en módulos del smoke
  promoterRole: false                    # [csv]
  rolPlanta: true                        # [csv] no observable
  esVendedor: true                       # [jerez-2026-06-22] CONFIRMADO en UI: heading "<h1>Vendedor</h1>" presente; jerez multi-empresa 3 acordeones
  visitRout: true                        # [csv]
  transactionHistory: true               # [csv]

  # Pedidos
  multiCurrencyOrder: false              # [csv] Tab Total solo moneda por defecto
  userCanChangePriceList: true           # [csv] id41 → DM-PRD-013 APLICA (puede cambiar lista de precio)
  userCanChangePriceListProduct: false   # [csv]
  unitByPriceList: false                 # [csv]
  showStock: true                        # [csv]
  stock0: true                           # [csv] permite pedir productos con stock 0
  validStock: true                       # [csv]
  validateWarehouses: true               # [csv] muestra almacenes/inventario en toma de pedido
  userCanChangeWarehouse: true           # [csv]
  userCanSelectGlobalDiscount: true      # [csv]
  userCanSelectProductDiscount: false    # [csv]
  userCanSelectIVA: false                # [csv]
  showCreditLimit: false                 # [csv]
  userCanChangePaymentConditions: true   # [csv]
  selectOrderType: false                 # [csv]
  productMinMul: false                   # [csv]
  featuredProducts: true                 # [csv]
  suggestedOrder: true                   # [csv] botón "Pedido Sugerido"
  suggestedOrderByDispatchAndReturn: false  # [csv]
  # ⚠ [jerez-2026-07-06] DISCREPANCIA UI-vs-config: CSV dice false, pero en Inventarios el botón "Pedido Sugerido"
  #   (ion-button.botonAddAmarillo) aparece y FUNCIONA → modal inventario-sugerido-modal "Sugerido PIEZA: 5, Despacho 50".
  #   Misma divergencia que piercar/expirationBatch. VERIFICAR valor efectivo con DESARROLLO antes de cambiar la VG (NO a ciegas).
  disableDaDispatch: true                # [csv] fecha despacho opcional/deshabilitada

  # Productos
  showProductImages: true                # [csv]
  productsOrderBy: "co_product"          # [csv]
  hideProductWarehouse: false            # [csv]
  vatExemptProducts: false               # [csv]

  # Devoluciones — validateReturn=TRUE (requiere factura)
  validateReturn: true                   # [csv] id24 → requiere seleccionar factura; DM-DEV-011 aplica
  requeridedNroFactura: true             # [csv] NroFactura requerido
  multiInvoices: true                    # [csv] permite productos de varias facturas en una devolución
  mesesFacturas: 3                       # [csv]
  signatureReturn: true                  # [csv]

  # Inventarios
  clientStock: true                      # [csv] id26 → módulo toma de inventario habilitado
  requireClientStock: false              # [csv]
  expirationBatch: true                  # [csv] id28 → Lote + Fecha venc en modal
  signatureStock: true                   # [csv] verificar Tab Adjuntos/Firma

  # Visitas
  signatureVisit: true                   # [csv] id29 → acordeón Firma

  # Cobros
  requiredCollectionAttachments: false   # [csv] id261 → adjunto OPCIONAL: cobros se ENVÍAN (no quedan Guardado). DM-COB-019 aplica
  requiredComment: false                 # [csv] id100 → DM-COB-006 N/A
  cobroPrepago: true                     # [csv] id76 → DM-COB-028 (Anticipo) aplica
  cobroRetencion: true                   # [csv] id77 → DM-COB-029 (+RETENCIÓN menú) aplica
  retencion: true                        # [csv] id236 → DM-COB-041/042 (retención por detalle de documento) aplican
  retentionDocTypeCR: true               # [csv] id88
  sizeRetention: 14                      # [csv] id89 → "Debe tener 14 caracteres"
  formatRetention: "Numeros"             # [csv] id90 valor 0 = Numeros (solo dígitos)
  userCanAddRetention: false             # [csv] id134 → DM-COB-032 N/A (no retención libre sin factura)
  userCanSelectIGTF: true                # [jerez-2026-07-06] EFECTIVO=true CONFIRMADO en UI (re-run): selector IGTF operable → opciones "IGTF - 0%" e "IGTF 3%" (defaultIgtf=true). El CSV id97=false está DESACTUALIZADO.
  # ✅ [jerez-2026-07-06] H4 RESUELTO: userCanSelectIGTF efectivo=true. DM-COB-036/044/045 NO son N/A estructural.
  #   Quedaron N/A por DATO (sin documento tipo IGTF elegible hoy: BRISAS DEL CAMPO KM 30 emp3 y EL PODER DEL MONO emp2 → 0 docs IGTF pese a saldo>0, ya drenados). Re-correr cuando exista un doc tipo IGTF vigente.
  userCanCollectIva: true                # [csv] id102 → DM-COB-037 APLICA (necesita cliente habilitado 25% IVA — descubrir)
  enablePartialPayment: true             # [csv] id232 → DM-COB-046 (pago parcial) aplica round-trip
  alwaysPartialPayment: false            # [csv]
  historicPartialPayment: true           # [csv]
  historicoTasa: true                    # [csv] id95 → habilita elegir fecha/tasa anterior
  canChangeRate: true                    # [csv] id231 → DM-COB-047 y 039(B) aplican (recálculo por fecha tasa)
  enabledManualRate: false               # [csv] id264 → DM-COB-039 rama A N/A (usar rama B fecha tasa)
  multiCurrencyCollection: true          # [csv] id91 → DM-COB-033/034 aplican
  multiCurrencyDeposit: true             # [csv] id92
  currencyBank: true                     # [csv] id94
  clientBankAccount: false               # [csv] id93 (bancos propios del receptor)
  tolerancia0: true                      # [csv] id79 permite cobros con diferencia
  userCanSelectCollectDiscount: false    # [csv] → DM-COB-031 N/A
  reconciliation: false                  # [csv]
  # colletionPayment (id78) = Efectivo, Transferencia, Deposito, Otros (Cheque y Pago Móvil OFF)
  #   → Efectivo HABILITADO ⇒ módulo Depósitos APLICA (requiere cobro con Efectivo)

  # Vendedores
  infoVendedores: false                  # [csv] id38 → módulo vendedores autogenerado en la app (no admin)

