#   - userCanCollectIva=FALSE             → DM-COB-037 (cobro 25% IVA) N/A ESTRUCTURAL
#   - enabledManualRate=TRUE / canChangeRate=FALSE → DM-COB-039 rama A (tasa manual) APLICA; DM-COB-047 (cambiar fecha tasa) N/A
#   - enterpriseEnabled=TRUE / userMustActivateGPS=FALSE / transportRole=FALSE
