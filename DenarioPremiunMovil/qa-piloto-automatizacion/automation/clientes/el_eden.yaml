    cliente_detalle: CROQUEMBOUCHE C.A.

  pedidos:
    cliente_test: AUTOMERCADOS FRESCO MARKET AFN, C.A. -  CAURIMARE
    estructura_producto: lineas
    alerta_deuda_vencida: true

  cobros:
    # ── Sub-tipos aplicables (co_type) — validado en device 2026-08-26 ──
    #   0 normal      ✅
    #   1 anticipo    ✅  (cobroPrepago=true)
    #   2 retención   ✅  (retencion=true, cobroRetencion=true)
    #   3 IGTF        ❌  N/A — userCanSelectIGTF=false (global) → campo IGTF no se muestra
    igtf_aplica: false
    anticipo_aplica: true
    retencion_aplica: true
    tolerancia:                         # por importe absoluto en US$ (TipoTolerancia=0, MonedaTolerancia=US$)
      permite_diferencia: true          # tolerancia0=true (global) — ⚠ confirmar en device
      positiva_max: 10                  # cobro que EXCEDE el saldo: pasa si diferencia < US$10, falla si >= US$10
      negativa_max: 10                  # cobro con FALTA: pasa si diferencia <= US$10, falla si > US$10
    metodos_pago_habilitados:           # colletionPayment (global) — Cheque queda OFF
      - Efectivo
      - Transferencia
      - Deposito
      - Otros
      - Pago Movil
    anticipo_automatico:                # automatedPrepaid=true — solo co_type 0, no en pago parcial
      activo: true
      umbral: 11                        # excedente >= US$11 → crea anticipo automático por el excedente
      moneda: "US$"
      # excedente < 11 → NO crea anticipo; entre tolerancia(±10) y umbral(11) hay borde a probar
    pagos_parciales: true               # enablePartialPayment — cobrar parte del saldo deja documento con saldo
    # ── Matriz de casos que la CORRIDA COMPLETA debe cubrir ──
    #  NORMAL (co_type 0):
    #    - cobro exacto (= saldo) → OK
    #    - cobro con falta <= US$10 (tolerancia) → OK
    #    - cobro con falta > US$10 → pago parcial (queda saldo)
    #    - cobro con exceso < US$10 → OK (dentro tolerancia)
    #    - cobro con exceso >= US$11 → OK + ANTICIPO AUTOMÁTICO por el excedente
    #    - métodos: Efectivo / Transferencia / Deposito / Pago Movil (Cheque debe estar OFF)
    #    - adjunto OBLIGATORIO (requiredCollectionAttachments) · firma habilitada · GPS obligatorio
    #  ANTICIPO manual (co_type 1): cobroPrepago=true
    #  RETENCIÓN (co_type 2): retencion=true · IVA+ISLR fijas (dynamicRetentions=false) · comprobante 14 díg alfanumérico · sin pago parcial de retención (retentionDocTypeCR global=true → SÍ permite; ⚠ confirmar)
    #  IGTF (co_type 3): ❌ N/A (userCanSelectIGTF=false)
