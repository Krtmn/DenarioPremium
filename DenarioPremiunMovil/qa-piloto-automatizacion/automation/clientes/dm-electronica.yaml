# → EFECTIVO presente ⇒ módulo Depósitos APLICA (regla: depósitos requiere Efectivo en métodos de cobro).
# Otras VGs de cobro relevantes: tolerancia0=true (⚠️override 2022=false), enablePartialPayment=true (→ DM-COB-046),
#   automatedPrepaid=true, multiCurrencyCollection=true, currencyBank=true (⚠️override 2022=false), historicoTasa=true.

