  - id: COB-WEB-DCTO-CONV-ETIQUETA
    titulo: "La columna `Descuento conversión` muestra el Diferencia/Faltante bajo la etiqueta de descuento"
    capa: web
    modulo: cobros
    detectado_en: "tag 20"
    estado: arreglado_verificado   # ✅ verificado 2026-08-04 en La Tortuga / globalmp, cobro 8363
