    detalle: >-
      Cobro 8353, documento `FF081401`: la columna `Descuento conversión` muestra **570.418,13**
      = `773,05 × 737,88`, pero **773,05 NO es el descuento** — es el `Diferencia/Faltante`. El descuento real
      de ese documento es `1.000,00` y vive en otra columna.
      La celda está **multiplicada Y bajo etiqueta equivocada**. Correcto: `773,05 / 737,88 = 1,05`, en una
      columna rotulada "Dif/Faltante conversión".
    diferencia_con_COB-WEB-DCTO-CONV-MULTIPLICA: >-
      🔑 **No son el mismo defecto y no se arreglan juntos.** Aquél es *la operación mal hecha sobre el número
      correcto*; éste es *además el número equivocado*. Si el fix corrige solo la dirección de la conversión,
      esta celda pasaría a mostrar `1,05` **pero seguiría rotulada "Descuento"** cuando el descuento es 1.000,00.
      **El error de etiqueta sobrevive al fix de la conversión.**
    verificado_20260804: >-
      ✅ **ARREGLADO — verificado el 2026-08-04** en La Tortuga / globalmp, cobro **8363**, documento `036332`.
      Se verificaron **los dos aspectos**, como pedía la acción:
      · **El número:** `Total dcto. conversion` = **1,36**, que es el descuento real (1.000,00 / 737,88).
      · **La etiqueta:** el `Diferencia/Faltante` (1.223,09) ya **no** se cuela en esa celda — vive en su
        propia columna **`Dif/Faltante conversión` = 1,66**, exactamente el rótulo que pedía la ficha.
    por_que_la_prueba_discrimina: >-
      🔑 La prueba **separa de verdad** este defecto del de la conversión: descuento y faltante dan
      **números distintos** (1,36 vs 1,66). Si sólo se hubiera arreglado la dirección de la conversión,
      la celda de descuento mostraría **1,66** (el faltante bien dividido, pero bajo la etiqueta equivocada).
      Muestra **1,36** ⇒ el error de etiqueta **no sobrevivió**, se arregló también.
    nota_sobre_el_8362: >-
      ℹ En el cobro **8362** (anterior al fix) el error de **etiqueta tampoco aparece**: cada columna trae su
      propio número, sólo que multiplicado (`737.880,00` el descuento y `164.613,65` el faltante).
      ⇒ Este defecto se corrigió **en la presentación**, no depende del dato guardado — a diferencia de
      [COB-WEB-DCTO-CONV-MULTIPLICA], que sí deja los registros viejos rotos.
    accion: "Cerrado — verificado el 2026-08-04 en ambos aspectos (número y etiqueta)."

