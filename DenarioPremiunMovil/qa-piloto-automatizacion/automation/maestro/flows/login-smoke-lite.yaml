appId: com.kiberno.denarioPremiumPro
---
# Piloto reducido: DM-LOG-003 + DM-LOG-001
# WebView Ionic: waitToSettleTimeoutMs 0, inputText, esperas fijas + coordenadas en modales
- launchApp
- extendedWaitUntil:
    visible: "ACEPTAR"
    timeout: 30000

# DM-LOG-003 — credenciales incorrectas
- tapOn:
    id: "ion-input-0"
    waitToSettleTimeoutMs: 0
    retryTapIfNoChange: false
- inputText: ${QA_USER}
- tapOn:
    id: "ion-input-1"
    waitToSettleTimeoutMs: 0
    retryTapIfNoChange: false
- inputText: ${QA_BAD_PASSWORD}
- hideKeyboard
- tapOn:
    point: "50%,64%"
    waitToSettleTimeoutMs: 0
    retryTapIfNoChange: false
- runScript:
    file: ../scripts/wait-ms.js
    env:
      MS: 12000
- tapOn:
    point: "79%,59%"
    waitToSettleTimeoutMs: 0
    retryTapIfNoChange: false
- extendedWaitUntil:
    visible: "ACEPTAR"
    timeout: 30000

# DM-LOG-001 — login exitoso
- tapOn:
    id: "ion-input-0"
    waitToSettleTimeoutMs: 0
    retryTapIfNoChange: false
- eraseText: 50
- inputText: ${QA_USER}
- tapOn:
    id: "ion-input-1"
    waitToSettleTimeoutMs: 0
    retryTapIfNoChange: false
- eraseText: 50
- inputText: ${QA_PASSWORD}
- hideKeyboard
- tapOn:
    point: "50%,64%"
    waitToSettleTimeoutMs: 0
    retryTapIfNoChange: false
- extendedWaitUntil:
    visible: "Visitas"
    timeout: 180000
- assertVisible: "Visitas"
