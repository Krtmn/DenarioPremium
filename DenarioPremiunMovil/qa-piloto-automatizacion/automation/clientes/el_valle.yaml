              # 🔴 adjunto OBLIGATORIO + comentario OBLIGATORIO · IGTF N/A · multimoneda N/A ·
              # retención por detalle (041/042) y por menú (029) · pago parcial (046) · anticipo (028)
  devoluciones: { cliente_test: TBD, factura_test: TBD, producto_test: TBD }  # tabs sin factura; Nro. factura requerido; 1 sola factura
  inventarios: { cliente_test: TBD }       # clientStock=true · expirationBatch=true ⇒ lote + fecha de expiración
  depositos:  { aplica: true, motivo_na: null }   # Efectivo en métodos de pago ⇒ aplica
  visitas:    { cliente_test: TBD, smoke_na_estructural: [] }  # signatureVisit=true · GPS obligatorio · visitRout=true
  productos:  { tipo_estructura_default: "Linea", texto_busqueda: TBD }  # listProductsBy=lineas · showProductImages=true
  vendedores: { aplica: TBD }              # esVendedor TBD; infoVendedores=false (módulo autogenerado)

ultima_corrida:
