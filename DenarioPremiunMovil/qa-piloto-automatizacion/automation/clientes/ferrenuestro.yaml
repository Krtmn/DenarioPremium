  quFileAttach: 1                        # [dump]
  cloudAttachments: false                # [dump] → adjuntos en servidor local
  imageWeightLimit: 30                   # [dump] MB
  longitudComentario: 200                # [dump]
  parteDecimal: 2                        # [dump]
  parteElntera: 15                       # [dump]
  tagRif: "RIF"                          # [dump]
  tagIVA: "IVA"                          # [dump]
  checkAddressClient: true               # [dump] → confirma cambio de sucursal en transacciones
  addressByUser: false                   # [dump]
  logoClient: false                      # [dump]
  visitRout: true                        # [dump]
  transportRole: false                   # [dump] → rol transportista NO
  promoterRole: false                    # [dump]
