#   - userCanSelectIGTF=TRUE              → DM-COB-036/044/045 aplican (persistencia tasa IGTF)
#   - expirationBatch=FALSE (CSV) pero UI muestra Lote+Fecha → ⚠ divergencia; confirmado en corrida [prc-2606]
