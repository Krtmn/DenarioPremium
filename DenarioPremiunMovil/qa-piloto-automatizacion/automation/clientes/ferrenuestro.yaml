# VGs pobladas desde el dump autoritativo de configuración (misma carpeta clientes/):
#   global_configuration_202607071252_FERRENUESTRO.md  (tabla global_configuration, snapshot 2026-07-07; G/P/C, ~172 filas)
# Las llaves coinciden 1:1 con globalConfig.get("<clave>") del código.
# Decisión QA (2026-07-07): la fuente efectiva de VGs es el archivo global_configuration_2026...FERRENUESTRO.md.
#   El segundo archivo global_configuration_client_...FERRENUESTRO.md (da_update 2023-02-01) NO se usa: es el seed base antiguo
#   (misma lógica que jerez, que descartó su global_configuration_client 2022).
#
# ⚠ 1ª corrida: los datos de prueba (cliente/factura/estructura/producto) están en TBD.
#   El agente debe DESCUBRIRLOS navegando las listas durante la corrida y reportarlos
#   para consolidarlos en este YAML al cierre.
# ⚠ El agente debe VERIFICAR las VGs contra la UI y MARCAR DISCREPANCIAS (dump dev vs app = posible bug de config).

# ══════════════════════════════════════════════════════════════════════════════
# ⚠ LECCIÓN: EL COMPORTAMIENTO SIGUE AL BUILD, NO AL CLIENTE — [ferrenuestro-20260723]
#   Este cliente fue re-apuntado a otro servidor entre dos corridas y su comportamiento cambió,
#   con los MISMOS datos de ferrenuestro (TORNICAGUA cód 121793873). Es la prueba más fuerte de que
#   estas propiedades NO son del cliente: se MIDEN en cada corrida, no se leen del perfil.
#   (Qué servidor era cada vez se registra en el REPORTE de la corrida, no acá.)
#   Diferencias observadas entre un build y el otro:
#     - window.ng: FALSE → **TRUE**. Probar !!window.ng al inicio, siempre.
#     - sync a nube: DIFERIDA ~3min → **INMEDIATA** (correlativos del server llegan en segundos).
#     - botón de alertas informativas: "Aceptar" → **"OK"** (los confirm de flujo aún usan Aceptar/Cancelar).
#     - envío de depósito: 2 alertas → **3 alertas**.
#   ⚠ COTEJO BD CAÍDO esta corrida: el DSN de qa-db.env (bloque "# Cliente: ferrenuestro") sigue
#   apuntando a la BD VIEJA de Isla Coche → permission-denied en TODAS las tablas → cotejo BD N/A
#   (verificación por captura de payload nativePromise + UI). NOTA EQUIPO: actualizar el DSN a la BD de
#   La Tortuga. (QA no toca secrets.)
# ══════════════════════════════════════════════════════════════════════════════

