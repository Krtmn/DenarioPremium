# dm-electronica/perfil.yaml
# Cliente NUEVO — también conocido como BOTZ / "DM ELECTRONIC".
# VGs derivadas del dump global_configuration_202607131130_DM_ELECTRONIC.md (tabla reciente, act. 2025-2026).
# Datos de prueba por módulo (modules.*) aún SIN confirmar: pre-poblar desde BD o descubrir en la 1ª corrida.
# Servidor: El Yaque (claves.env ya apunta aquí, etiqueta "El Yaque DM ELECTRONIC v6.6.18").

cliente_id: dm-electronica
cliente_nombre: "DM ELECTRONICA"            # alias BOTZ — confirmar nombre EXACTO en la app durante la 1ª corrida
ws_url: "http://denarioelyaque.ddns.net:8081/PremiumWS/services/"  # El Yaque (mismo host que romher). claves.env ya en este WsUrl.
apk_package: com.kiberno.denarioPremiumPro
db_name: dm_electronica                     # base de este cliente para el Agente 12 / oráculo BD. DSN read-only en el bloque "# Cliente: dm-electronica" de secrets/qa-db.env. Read-only CONFIRMADO 2026-07-13 (SELECT 1 OK). GRANT en Postgres es POR-BASE.

# ── VGs — desde global_configuration (2026-07-13). Divergencias vs override 2022 marcadas ⚠️VERIFICAR ──
vgs:
  multiCurrency: true                       # global=true (override 2022 decía false) ⚠️VERIFICAR en corrida
  expirationBatch: false                    # global=false → inventarios SIN lote/fecha de expiración
  suggestedOrder: true                      # global suggestedOrder(P,22)=true → "Pedido Sugerido" activo en Inventarios (tab Resumen), como don-theo
  suggestedOrderByDispatchAndReturn: false  # global=false. VG distinta a suggestedOrder — dejar false
  requiredCollectionAttachments: true       # global=true → COBRO REQUIERE ADJUNTO (mockCameraAdjunto obligatorio); DM-COB-019 NO se salta
  requiredComment: true                     # global=true → comentario obligatorio en cobro → DM-COB-006 APLICA
  validateReturn: true                      # global=true → devoluciones validan producto contra factura enviada. requeridedNroFactura=true (nro factura obligatorio), multiInvoices=false (una factura por devolución)
  signatureReturn: true                     # global signatureReturn=true
  signatureCollection: true                 # global signatureCollection=true
  signatureVisit: true                      # global signatureVisit=true
  userCanUploadFiles: true                  # global userCanUploadFiles=true
  esVendedor: true                          # CONFIRMADO QA 2026-07-13: usuario QA 002 es vendedor → módulo Vendedores aplica. (No viene en el dump)
  enterpriseEnabled: true                   # ✅ CONFIRMADO EN CORRIDA 2026-07-13 (clientes): UI expone "Empresa: BOTZ" (selector requerido en cliente potencial, fila en detalle, payload idEnterprise:1/coEnterprise:"BARAK_A"). El global=false del dump estaba obsoleto; manda la UI.
  enabledManualRate: true                   # global=true → tasa manual permitida en cobros. canChangeRate=false, historicoTasa=true
  cobroPrepago: true                        # global=true → anticipo/prepago aplica (DM-COB-028). OJO requiredAnticipoAttachments=true → el anticipo también EXIGE adjunto
  cobroRetencion: false                     # global=false → botón +RETENCIÓN del menú NO disponible → DM-COB-029 N/A
  retencion: false                          # global=false → detalle de documento SIN campos retención → DM-COB-041/042 N/A
  sizeRetention: 14                          # global=14 (N/A operativamente: retencion=false)
  formatRetention: "0"                       # global="0" = Números (N/A operativamente: retencion=false)
  userCanSelectIGTF: false                  # global=false → sin selector IGTF → DM-COB-044/045 N/A
  userCanCollectIva: false                  # global=false → sin cobro 25% IVA → DM-COB-037 N/A
  transportRole: false                      # global transportRole=false
  userMustActivateGPS: true                 # global=true → obligar GPS activo para transacciones. userCanSaveGPS=true, visitRout=true

# ── Métodos de pago de Cobros (colletionPayment = true-false-true-true-true-true) ─────────────────
