  productStock0: false                   # [dump]
  validStock: true                       # [dump]
  validateWarehouses: true               # [dump] → muestra almacenes/inventario en toma de pedido
  userCanChangeWarehouse: false          # [dump]
  showWarehouseDetails: true             # [dump]
  hideProductWarehouse: false            # [dump]
  userCanSelectGlobalDiscount: false     # [dump] → sin descuento global en pedido
