#     users_data   → id_user=309          ⇒ **co_user = 'VE0002'**
#     client_template_user → co_user='VE0002' ⇒ **30 clientes asignados** (21 con documentos)
#
# 🔴 TRAMPA DEL IDENTIFICADOR (igual que en grupo_fiel): `client_template_user.co_user` son
#   códigos 'VE00NN', **no logins**. Filtrar por 'scarlet' devuelve 0 filas y parece que no
#   tiene cartera. El puente login→co_user está en **`users_data`**, no en `users`.
#
# ⚠ `name_user` en BD trae un **espacio al final** ("SCARLET "). Cotejar con trim.
#
# 🔴 [kron-20260817] **`users` en kron NO tiene `co_user`** — solo `login_user`, `name_user`, `lastname_user`
#   (⚠ `lastname_user`, **no** `last_name_user`). **El nombre completo que muestra la web es
#   `name_user + ' ' + lastname_user`.** Cotejar solo contra `name_user` produce un
#   **falso `WEB-FIELD-MISMATCH` en el 100 % de las filas**. El `co_user` vive en `users_data`.
#   ⚠ En la web el label del vendedor puede venir con **DOBLE espacio** ("SCARLET  FLOREZ") y en visitas
#     como "VE0002 - SCARLET  FLOREZ" ⇒ normalizar espacios; un `===` literal falla.
# ⚠ `potential_client` **sí** tiene `co_user`, y su fecha es **`da_client`**.
#
# ⚠ Filtrar SIEMPRE por el vendedor QA: un cliente no asignado NO aparece en la app.

