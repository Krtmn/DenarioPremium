# ── VGs — desde global_configuration OSOROMA 2026-07-08 (salvo esVendedor, ver nota) ──────────
# ⚠ DIFERENCIAS CLAVE que afectan cobertura del smoke:
#   - requiredCollectionAttachments=FALSE  → cobro NO requiere adjunto → DM-COB-019 ENVIABLE (≠ piercar/romher que quedan Guardados)
#   - cobroRetencion=TRUE + retencion=TRUE → AMBAS retenciones aplican: DM-COB-029 (botón) Y DM-COB-041/042 (detalle) — PERO 0 facturas → N/A-DATA
#   - userCanSelectIGTF=TRUE + igtfDefault=TRUE → DM-COB-044/045 aplican; IGTF doc separado ACTIVADO por defecto
#   - clientStock=FALSE  → ⚠ módulo "toma de inventario en el cliente" DESHABILITADO → INVENTARIOS probablemente N/A completo (confirmar botón en corrida)
#   - validateReturn=FALSE + requeridedNroFactura=FALSE + 0 facturas sincronizadas → DEVOLUCIONES libre/limitado, casos con factura N/A-DATA
#   - enterpriseEnabled=TRUE con 3 empresas → campo Empresa en todos los módulos; asignar idEnterprise explícito aunque sea única visible
#   - multiCurrencyOrder=FALSE (pese a multiCurrency=TRUE) → Pedidos solo moneda por defecto
vgs:
  multiCurrency: true                       # global multiCurrency=true. ⚠ confirmar en UI (client-override legacy decía false)
  expirationBatch: false                    # global expirationBatch=false → sin lote+fecha (además clientStock=false hace N/A la toma en cliente)
  suggestedOrder: true                      # global suggestedOrder=true (P,22) → "Pedido Sugerido"
  suggestedOrderByDispatchAndReturn: false  # global=false (VG distinta; no contradice suggestedOrder) → DM-INV-017 N/A
  requiredCollectionAttachments: false      # global=false → cobro NO requiere adjunto → DM-COB-019 ENVIABLE
  requiredComment: false                    # global requiredComment=false → DM-COB-006 N/A
  validateReturn: false                     # global=false → devoluciones NO valida producto contra factura enviada
  requeridedNroFactura: false               # global=false → nro factura NO obligatorio en devoluciones
  multiInvoices: false                      # global=false → no se devuelven productos de varias facturas
  signatureReturn: true                     # global signatureReturn=true
  signatureCollection: true                 # global signatureCollection=true
  signatureVisit: true                      # global signatureVisit=true
  signatureOrder: true                      # global signatureOrder=true
  signatureDeposit: true                    # global signatureDeposit=true
  signatureStock: true                      # global signatureStock=true
  signatureClient: true                     # global signatureClient=true
  userCanUploadFiles: true                  # global userCanUploadFiles=true
  showCamera: true                          # global showCamera=true
  quAttach: 25                              # global quAttach=25
  quFileAttach: 1                           # global quFileAttach=1
  emailWithAttach: true                     # global emailWithAttach=true
  cloudAttachments: false                   # global cloudAttachments=false → adjuntos en servidor local
  imageWeightLimit: 30                       # global imageWeightLimit=30 MB
  esVendedor: true                          # CONFIRMADO QA 2026-07-08: usuario 001 es VENDEDOR → módulo Vendedores aplica.
  infoVendedores: true                      # global infoVendedores=true (id38, 2026-02-12) → módulo vendedores GESTIONADO desde admin (archivo USER_INFORMATION), NO autogenerado (≠ piercar false)
  enterpriseEnabled: true                   # global=true → campo Empresa en todos los módulos (3 empresas: SICURA/AYALA/OSOROMA)
  enabledManualRate: false                  # global enabledManualRate=false
  canChangeRate: false                      # global canChangeRate=false (306, 2026-06-28) → NO permite cambiar fecha de la tasa → DM-COB-047 N/A
  historicoTasa: true                       # global historicoTasa=true → selector de tasas anteriores (mesesTasa=3)
  mesesTasa: 3                               # global mesesTasa=3
  cobroPrepago: true                        # global cobroPrepago=true → DM-COB-028 (anticipo) aplica
  automatedPrepaid: true                    # global automatedPrepaid=true → abono automático por diferencia positiva (tolerancia0)
  cobroRetencion: true                      # global cobroRetencion=true → botón +RETENCIÓN → DM-COB-029 aplica (requiere factura → N/A-DATA hoy)
  retencion: true                           # global retencion=true → campos retención en detalle → DM-COB-041/042 aplican. ⚠ confirmar en UI (override legacy decía false)
  sizeRetention: 14                         # global sizeRetention=14 → nro comprobante retención = 14 dígitos
  formatRetention: "0"                       # global formatRetention="0" (Numeros)
  retentionDocTypeCR: true                  # global retentionDocTypeCR=true → maneja documentos de retención
  userCanAddRetention: true                 # global userCanAddRetention=true → retenciones libres sin factura
  userCanSelectIGTF: true                   # global userCanSelectIGTF=true → selector IGTF → DM-COB-044/045 aplican. ⚠ confirmar en UI (override legacy decía false)
  igtfDefault: true                         # global igtfDefault=true → IGTF en documento separado ACTIVADO por defecto
  disableCheckIGTF: false                   # global disableCheckIGTF=false → usuario puede cambiar el check de IGTF separado
  userCanCollectIva: false                  # global=false → DM-COB-037 (cobro 25% IVA) N/A
  enablePartialPayment: true                # global enablePartialPayment=true → DM-COB-046 (pago parcial) aplica
  alwaysPartialPayment: false               # global alwaysPartialPayment=false
  historicPartialPayment: true              # global historicPartialPayment=true
  tolerancia0: true                         # global tolerancia0=true → se permiten cobros con diferencia (tolerancia)
  enableDifferenceCodes: true               # global enableDifferenceCodes=true → selector de origen de diferencia en cobros
  userCanSelectCollectDiscount: false       # global=false → sin descuentos en cobros
  reconciliation: false                     # global reconciliation=false
  multiCurrencyCollection: true             # global=true → cobros ambas monedas
  multiCurrencyDeposit: true                # global=true → depósitos ambas monedas
  multiCurrencyOrder: false                 # global=false → Pedidos SOLO moneda por defecto (pese a multiCurrency=true)
  currencyModule: true                      # global currencyModule=true
  currencyBank: true                        # global currencyBank=true → ver todos los bancos sin importar moneda del cobro
  validateCollectionDate: true              # global validateCollectionDate=true → fecha de tasa = fecha del depósito/transferencia
  clientStock: false                        # ⚠ global clientStock=false → módulo TOMA DE INVENTARIO EN CLIENTE DESHABILITADO → INVENTARIOS probablemente N/A (confirmar botón en corrida)
  requireClientStock: false                 # global requireClientStock=false → no exige toma inventario antes de pedido
  selectOrderType: true                     # global selectOrderType=true (P,26) → campo "tipo de pedidos" habilitado
  userCanChangePriceList: true              # global userCanChangePriceList=true → puede cambiar lista de precio
  userCanChangeWarehouse: false             # global userCanChangeWarehouse=false
  showStock: true                           # global showStock=true → muestra inventario en pedido
  validStock: false                         # global validStock=false → sin alerta al cargar producto sin inventario
  stock0: true                              # global stock0=true → permite pedidos a productos con stock 0
  validateWarehouses: true                  # global validateWarehouses=true (2026-06-15) → muestra almacenes e inventario en toma de pedido
  showCreditLimit: false                    # global showCreditLimit=false → oculta límite de crédito
  userCanSelectIVA: true                    # global userCanSelectIVA=true (P,13) → muestra IVA en pedido
  disableDaDispatch: true                   # global disableDaDispatch=true → fecha de despacho opcional y deshabilitada por defecto
  checkAddressClient: true                  # global checkAddressClient=true → ventana de confirmación al cambiar de sucursal
  addressByUser: true                       # global addressByUser=true → sucursales asignadas a vendedores (CLIENT_TEMPLATE_USER) → el usuario 001 solo ve SUS clientes/sucursales
  visitRout: true                           # global visitRout=true → rutas planificadas visibles en visitas
  userMustActivateGPS: true                 # global userMustActivateGPS=true → obligar GPS activo para transacciones
  userCanSaveGPS: true                      # global userCanSaveGPS=true → capturar coordenadas de sucursales en visitas
  transportRole: true                       # global transportRole=true → rol Transportista habilitado
  rolPlanta: true                           # global rolPlanta=true → rol Planta habilitado
  promoterRole: false                       # global promoterRole=false
  transactionHistory: true                  # global transactionHistory=true (historyMonths=3)
  historyMonths: 3                           # global historyMonths=3
  mesesFacturas: 3                           # global mesesFacturas=3
  longitudComentario: 200                    # global longitudComentario=200
  tagRif: "RIF"                              # global tagRif=RIF
  tagIVA: "IVA"                              # global tagIVA=IVA
  clientsOrderBy: "na_client"               # global clientsOrderBy=na_client → clientes ordenados por nombre
  productsOrderBy: "co_product"             # global productsOrderBy=co_product → productos ordenados por código
  vatExemptProducts: true                   # global vatExemptProducts=true → IVA por producto (archivo product)
  colletionPayment:                         # global=true-false-true-true-false-true → Efectivo,Cheque,Transferencia,Deposito,Otros,PagoMovil
    - "Efectivo"                            # ON
    - "Transferencia"                       # ON
    - "Deposito"                            # ON
    - "Pago Movil"                          # ON
    # OFF: Cheque, Otros

