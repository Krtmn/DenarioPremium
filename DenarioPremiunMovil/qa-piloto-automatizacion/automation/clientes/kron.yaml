#   rótulo UI (`lb_enterprise`) = "CHOCOLATES KRON, C.A"  ← SIN punto final
#   `na_enterprise`             = "CHOCOLATES KRON, C.A." ← CON punto (así sale en el DETALLE web)
#
# ✅ RESUELTO [kron-20260817] — **NO era una incoherencia.** `enterpriseEnabled=true` con una sola
#   empresa se comporta **idéntico** a grupo_fiel, que la tenía en `false`: el selector aparece, viene
#   resuelto solo y todo caso de CAMBIO de empresa es N/A. **La VG NO gobierna la variante del selector**
