# ── Estados por módulo ────────────────────────────────────────────────────────
# 🔴🔴 ADVERTENCIA CRÍTICA PARA EL COTEJO BD — mismo patrón que en el_palmar,
#     RECONFIRMADO acá el 2026-08-07:
#     El `st_*` de la transacción **NO es traducible por el catálogo `statuses`**.
#     Los 19.771 cobros de la tabla `collection` tienen **st_collection = 1**, sin excepción.
