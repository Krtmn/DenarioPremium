# el_valle/perfil.yaml
# Cliente EL VALLE (COVADONGA). Perfil construido de los 2 dumps 20260728.
#   - global_configuration_202607281234_EL VALLE.md         (principal, filas 2025-2026 → AUTORITATIVO)
#   - global_configuration_client_202607281234EL VALLE .md  (por-cliente, casi todo 2023-02-01 → OVERRIDE STALE)
# ℹ Esos 2 dumps se ELIMINARON el 2026-07-28 una vez construido este perfil y CORRIDO el smoke
#   (política de `alta-cliente.md`: el dump es insumo, el YAML es el producto). Recuperables desde git.
# ⚠ REGLA: cuando difieren, gana el da_update más reciente. Conflictos marcados ⚠️VERIFICAR.
#   Excepción detectada: userCanSelectProductDiscount y validateWarehouses tienen filas 2026 en AMBOS dumps
#   → ahí se comparó fecha contra fecha, no dump contra dump.
#
# ⚠ SERVIDOR: **NO se fija en el perfil.** EL VALLE está HOY en La Tortuga, pero los clientes se montan
#   en cualquiera de las 3 playas según disponibilidad (El Yaque / Isla Coche / La Tortuga).
#   El servidor efectivo se DESCUBRE EN RUNTIME (host de los payloads / config de la app) y se registra
#   en el REPORTE de la corrida, nunca aquí. Ver banner de desacople en _schema.yaml.
#
# ⚠ NOMBRE DE BLOQUE EN SECRETOS: los bloques existentes dicen "# Cliente: el valle" (CON ESPACIO) tanto en
#   secrets/qa-credentials.env como en secrets/qa-db.env, pero la base y este perfil son "el_valle".
#   → ANTES DE CORRER: renombrar ambos encabezados a "# Cliente: el_valle" para que QA_CLIENTE=el_valle
#     resuelva perfil + credenciales + DSN con la misma clave. (fetchCreds ahora LANZA si no encuentra
#     el bloque exacto, así que la incoherencia se detecta al instante en vez de usar credenciales ajenas.)

cliente_id: el_valle
cliente_nombre: "EL VALLE (COVADONGA)"
# ✅ Nombre EXACTO de la empresa (leído de la web de La Tortuga 2026-07-28):
#    "PROCESADORA DE ALIMENTOS COVADONGA,C.A"   ← usar este literal en el selector Empresa
apk_package: com.kiberno.denarioPremiumPro
db_name: el_valle                             # base en el RDS CENTRAL 'savia'
# ✅ BD LEGIBLE: **185/185 tablas** para user_read (GRANT aplicado por QA y verificado 2026-07-28).
#   ⇒ cotejo BD v2 ACTIVO en los 7 transaccionales, y modules.* quedó PRE-POBLADO desde BD (abajo).

# ── VGs — del global_configuration reciente 20260728. Conflictos vs client-config 2023 marcados ⚠️VERIFICAR ──
vgs:
  multiCurrency: true                         # ambos dumps coinciden
  expirationBatch: true                       # ✅ CONFIRMADO EN CORRIDA [el_valle-20260728] — el dump client-2023=false
                                              #   queda DESCARTADO. Lote y Fecha de vencimiento son **OBLIGATORIOS**:
                                              #   con solo cantidad la app rechaza con "Complete cantidad, unidad,
                                              #   fecha y lote para continuar." y el producto NO queda inventariado.
                                              #   ⚠ La VG gobierna la VALIDACIÓN, no la visibilidad (los campos se
                                              #   renderizan igual con false) — ver _comunes.md.
  clientStock: true                           # (global 2026-05-18) módulo Inventarios APLICA
  requireClientStock: false                   # ⚠️VERIFICAR global=false vs client-2023=true → no exige inventario previo al pedido
  suggestedOrder: true                        # botón "Pedido Sugerido"
  suggestedOrderByDispatchAndReturn: false
  validateReturn: false                       # devoluciones: tabs habilitan SIN seleccionar factura
  requeridedNroFactura: true                  # …pero el Nro. de factura SÍ es campo obligatorio
  multiInvoices: false                        # una sola factura por devolución
  requiredCollectionAttachments: true         # 🔴 (2026-06-23) EL COBRO **EXIGE ADJUNTO** → usar mockCameraAdjunto/ensureAdjunto
  requiredAnticipoAttachments: false          # (2026-07-23) anticipo NO exige adjunto
  requiredRetentionAttachments: false         # (2026-07-23) retención NO exige adjunto
  requiredComment: true                       # 🔴 (2026-03-03) comentario OBLIGATORIO en cobro → DM-COB-006 APLICA
  requiredCommentOrder: false                 # (2026-07-27, la fila más reciente del dump) pedido NO exige comentario
  signatureOrder: true
  signatureReturn: true
  signatureCollection: true
  signatureDeposit: true
  signatureStock: true
  signatureVisit: true                        # (2026-04-20)
  signatureClient: true
  userCanUploadFiles: true
  showCamera: true
  cloudAttachments: false                     # adjuntos en servidor local, no en nube
  esVendedor: true                            # ✅ CONFIRMADO EN UI [el_valle-20260728] — era el último TBD del perfil.
                                              #   3 señales independientes: tile "Vendedores" en HOME +
                                              #   <h1>Vendedor</h1> en app-vendedores + KPIs poblados por el
                                              #   servidor (Cartera Clientes 480). infoVendedores=false ⇒ el
                                              #   módulo lo genera la app, no un archivo USER_INFORMATION.
  infoVendedores: false                       # módulo Vendedores se genera automáticamente en la app
  enterpriseEnabled: true                     # empresa habilitada… ⚠️VERIFICAR alcance (ver orderEnterpriseEnabled)
  orderEnterpriseEnabled: false               # ✅ CONFIRMADO-CON-MATIZ [el_valle-20260728] el campo Empresa **SÍ se
                                              #   renderiza** en Pedidos, pero como ion-select DESHABILITADO con
                                              #   "PROCESADORA DE ALIMENTOS COVADONGA" preseleccionada. No es ausencia
                                              #   del campo → no esperar que falte, esperar que esté bloqueado.
  enabledManualRate: false                    # → DM-COB-039 rama A (tasa manual) N/A
  canChangeRate: false                        # (2026-07-23) → DM-COB-047 (fecha tasa editable) N/A
  historicoTasa: true                         # mesesTasa=3 (global) ⚠️ client-2023=6
  cobroPrepago: true                          # ANTICIPO/PREPAGO aplica → DM-COB-028
  cobroRetencion: true                        # (2026-03-10) botón +RETENCIÓN del menú → DM-COB-029
  retencion: true                             # (2026-03-09) retenciones de impuesto activas
  retentionDocTypeCR: true                    # ⚠️VERIFICAR global 2025-11-03=true vs client-2023=false → GANA true
                                              #   ⇒ retención POR DETALLE de documento → DM-COB-041/042 APLICAN
  userCanAddRetention: true                   # (2026-01-16) retenciones libres SIN factura asociada
  dynamicRetentions: false                    # retención ESTÁNDAR (IVA/ISLR fijos)
  missingRetention: false
  alwaysRetention: false
  sizeRetention: 14
  formatRetention: "0"                        # 0 = Numeros (ambos dumps coinciden)
  userCanSelectIGTF: false                    # 🔴⚠️VERIFICAR global 2025-09-17=false vs client-2023=true → GANA false
                                              #   ⇒ DM-COB-036 / 044 / 045 (IGTF) = **N/A**
  igtfDefault: false
  userCanCollectIva: false                    # → DM-COB-037 (cobro 25% IVA) N/A
  tolerancia0: true                           # ⚠️VERIFICAR global 2025-04-15=true vs client-2023=false → se permiten cobros con diferencia
  TipoTolerancia: "0"                         # Importe · MonedaTolerancia=USD · rangos ±100000
  automatedPrepaid: true                      # abono automático por diferencia positiva (prepaidPaymentMethod="pa")
  enablePartialPayment: true                  # → DM-COB-046 (pago parcial) APLICA
  alwaysPartialPayment: false
  historicPartialPayment: true
  multiCurrencyCollection: false              # ⚠️VERIFICAR global 2026-06-23=false vs client-2023=true → GANA false
                                              #   ⇒ DM-COB-033/034 (multimoneda en cobro) **N/A**
  multiCurrencyDeposit: false                 # (2026-06-23)
  multiCurrencyOrder: false                   # ⚠️VERIFICAR global 2025-09-17=false vs client-2023=true → GANA false
  currencyBank: false                         # solo bancos de la moneda del cobro
  clientBankAccount: false
  validateCollectionDate: false
  userCanSelectCollectDiscount: false
  enableDifferenceCodes: false
  streetDay: false
  reconciliation: false
  userMustActivateGPS: true                   # GPS obligatorio para transacciones
  userCanSaveGPS: true
  transactionCoordinateRadius: 50             # metros: fuera de rango se marca en reportes
  visitRout: true                             # rutas planificadas visibles en Visitas
  checkAddressClient: true                    # confirma cambio de sucursal
  transportRole: false
  promoterRole: false
  rolPlanta: false
  transactionHistory: true                    # historyMonths=1
  clientsOrderBy: na_client                   # ⚠️VERIFICAR global 2026-05-08=na_client vs client-2023=co_client
  productsOrderBy: co_product
  listProductsBy: lineas                      # solo en client-2023 (no hay valor en el global)
  tagRif: RIF
  tagIVA: IVA
  longitudComentario: 200                     # ⚠️VERIFICAR global 2026-05-15=200 vs client-2023=185
  parteDecimal: 4                             # ⚠️VERIFICAR global 2025-09-17=4 vs client-2023=2

# ── Métodos de pago Cobros: colletionPayment = true-false-true-true-false-true (global 2026-06-23, 6 valores) ──
# Efectivo=SÍ · Cheque=NO · Transferencia=SÍ · Depósito=SÍ · Otros=NO · **Pago Móvil=SÍ** ← 6º método nuevo
#   ⚠️VERIFICAR client-2023 traía solo 5 valores (sin Pago Móvil). hideColletionPayment=true ⇒ manda colletionPayment.
# → EFECTIVO presente ⇒ módulo **DEPÓSITOS APLICA**.
#
# ── VGs de Pedidos (global reciente) ──
# stock0=true (se pueden pedir productos sin inventario) ⚠️client-2023=false · showStock=false (2026-04-28) ·
# validateWarehouses=true ✅CONFIRMADO en UI+BD [el_valle-20260728]: el ítem muestra "Almacén: 1 - PRODUCTO
#   TERMINADO (EMBUTIDOS)" y la BD lleva co_warehouse=010 → el `false` del client-config era dump stale ·
# userCanSelectProductDiscount=false ✅CONFIRMADO (ningún control de descuento por producto en la UI) ·
# userCanChangeWarehouse=false ·
# userCanChangePriceList=true (2026-03-10) ⚠️client-2023=false · userCanChangePriceListProduct=true ·
# userCanSelectProductDiscount=**false** (client 2026-03-09 es MÁS RECIENTE que global 2026-03-03) ⚠️VERIFICAR ·
# userCanSelectGlobalDiscount=false · userCanSelectIVA=false · userCanChangePaymentConditions=true (2026-03-03) ·
# selectOrderType=true ⚠️client-2023=false · showCreditLimit=true · disableDaDispatch=true (fecha despacho opcional) ·
# validateNuOrder=false · groupByTotalByLines=true · totalUnit=true · codeTotalProductUnit=CJA ·
# featuredProducts=true (nameProductLine=DESTACADOS) · productMinMul=false ⚠️client-2023=true · quPageProduct=50

# ── Datos de prueba por módulo — PRE-POBLADOS desde BD read-only 2026-07-28 (GRANT aplicado: 185/185) ──
# ⚠ Los clientes listados están FILTRADOS POR EL VENDEDOR QA vía client_template_user: son los que la app
#   realmente le muestra. Un cliente con documentos que no esté asignado al vendedor NO sirve para el smoke.
# ⚠ CORRECCIÓN AL PROCESO (alta-cliente.md Paso 2): la guía consulta la tabla `invoice`, que en este esquema
#   está VACÍA (0 filas). Los documentos de venta viven en **`document_sale`** (2.783 filas) y el saldo
#   pendiente es **`nu_balance`** (no `nu_amount_pending`). Corregir la guía.
modules:
  login:      { bad_password: "usar QA_BAD_PASSWORD del bloque # Cliente: el_valle" }

  clientes:   { cliente_busqueda: "ABASTOS Y CARNICERIA HERMANOS FLORES CA",   # co_client J309901710
                cliente_detalle: "ADC FOODS, C.A",                              # co_client J505381237
                empresa_potencial: TBD }                                        # ⚠ nombre exacto a descubrir en UI
              # clientsOrderBy=na_client → la lista sale ordenada por NOMBRE · firma habilitada

  pedidos:    { cliente_test: "ABASTOS Y CARNICERIA HERMANOS FLORES CA",
                producto_test: "ALAS DE POLLO",          # co_product C0051 · precio 4,80
                producto_alt:  "COSTILLA CHINA DE CERDO" }  # co_product C0003 · precio 6,80
              # ✅ [el_valle-20260728] 14/14 PASS · pedido Ref 437 (=id_order) BD-OK campo-a-campo
              # ⚠ CORRECCIONES del perfil halladas en corrida:
              #   · codeTotalProductUnit decía "CJA" pero UI y BD usan **PIEZA / PZA-** → no esperar CJA
              #   · el Tab Pedido NO tiene searchbar → `texto_busqueda` no aplica acá (sí en Productos)
              #   · línea "DESTACADOS" (featuredProducts) está VACÍA en esta playa
              # Estructura del Tab Pedido: HÍBRIDA — `ion-item.listaItems` (categoría) que al expandir
              #   INYECTA un `ion-accordion-group` de productos. Son dos niveles, no dos builds distintos.
              # SIN empresa (orderEnterpriseEnabled=false ⚠️VERIFICAR) · sin multimoneda · comentario NO obligatorio
              # stock0=true (se pueden pedir productos sin inventario) · 80 productos en catálogo

  cobros:     { cliente_test: "ARMAS DEL ROSARIO, C.A",   # co_client J404786856 · 3 docs, 3 vencidos, 1.002,50 USD
                clientes_con_documentos:
                  - "ARMAS DEL ROSARIO, C.A"                       # J404786856 · 3 docs · 1.002,50 USD
                  - "PROTECCION ELECTRODIGITAL, C.A"               # J401330134 · 3 docs ·    49,61 USD
                  - "COMERCIALIZADORA J.R MALAVE ANUEL, C.A"       # J408621282 · 2 docs · 1.898,95 USD
                  - "MERCADOS DE ALIMENTOS, C.A"                   # G200035919 · 2 docs ·   628,56 USD
                  - "ALFREDO A HERNANDEZ S (INV LA ROCA HERNANDEZ FP)"  # V146335175 · 1 doc · 132,89 USD
                banco_test: "BANCO MERCANTIL COVADONGA**9555 NUEVO",   # co_bank 1101003 (13 bancos activos)
                cliente_25iva: null }                    # userCanCollectIva=false → DM-COB-037 N/A
              # 🔴 adjunto OBLIGATORIO + comentario OBLIGATORIO · IGTF N/A · multimoneda N/A ·
              # retención por detalle (041/042) y por menú (029) · pago parcial (046) · anticipo (028)
              # ⚠ TODOS los documentos del vendedor están VENCIDOS y en USD → clientes en ROJO en la lista

  devoluciones: { cliente_test: "ARMAS DEL ROSARIO, C.A",
                  producto_test: "ALAS DE POLLO",
                  tipo_devolucion: "Calidad",            # id_type 60 (otros: PostVenta 52, Servicio 59, Cambio X Cambio 63)
                  motivo_devolucion: "Empaque Sucio (Inocuidad)",   # id_motive 36
                  factura_test: TBD }                    # ⚠ el Nro. de factura se TIPEA (requeridedNroFactura=true)
              # validateReturn=false → las tabs habilitan SIN seleccionar factura · multiInvoices=false

  inventarios: { cliente_test: "ABASTOS Y CARNICERIA HERMANOS FLORES CA",
                 producto_test: "ALAS DE POLLO" }
              # clientStock=true · expirationBatch=true ⇒ lote + fecha de expiración habilitados

  depositos:  { aplica: true, motivo_na: null,
                banco_test: "BANCO MERCANTIL COVADONGA**9555 NUEVO" }
              # Efectivo en métodos de pago ⇒ aplica · multiCurrencyDeposit=false

  visitas:    { cliente_test: "ABASTOS Y CARNICERIA HERMANOS FLORES CA",
                actividad_test: "COBRANZA",              # id_type 82 (otras: MERCHANDISING 47, NO COMPRO 71, VENTA EN RUTA 85)
                smoke_na_estructural: [] }
              # signatureVisit=true · GPS obligatorio · visitRout=true · radio 50 m

  productos:  { tipo_estructura_default: "Linea", texto_busqueda: "COSTILLA" }
              # listProductsBy=lineas · showProductImages=true · productsOrderBy=co_product · 80 productos

  vendedores: { aplica: true }             # ✅ esVendedor=true confirmado en UI · módulo autogenerado (infoVendedores=false)
                                           # ⚠ KPIs poblados PARCIALMENTE: los 7 de cartera sí, pero faltan
                                           #   "Cuota Mes" y "Venta Real Mes" (que sí traen ferrenuestro/dm-electronica).
                                           #   El poblado NO es binario: hay un 3er estado "cartera sí / metas no".
                                           # ⚠ El header de empresa se TRUNCA a ~20 chars ("PROCESADORA DE ALIME") →
                                           #   matchear por PREFIJO, nunca por igualdad exacta contra el YAML.

ultima_corrida:
  run_id: "20260728_130612_smoke-completo"
  fecha: "2026-07-28"
  build: { app_version: "1.0", db_version: 19, window_ng: true }
  resultado: "97 PASS · 0 FAIL · 5 N/A · 1 BLOCKED (103 casos, 10/10 módulos)"
  capa_web: "9 registros cotejados en La Tortuga: 8 WEB-OK · 1 WEB-CALC-MISMATCH"
  defectos_abiertos:
    - id: COB-SYNC-DIFERIDA
      modulo: cobros
      detalle: >-
        El envío de cobros tardaba ~28-75 min en llegar a la nube (Ref 119: 75 min · Ref 120: 28 min),
        mientras pedidos/devoluciones/inventarios/depósitos sincronizaban de inmediato en la misma sesión.
        Desarrollo aplicó un arreglo el mismo día. ⚠ FALTA re-medir la latencia para confirmarlo con datos.
    - id: COB-RET-TOTAL-CERO
      modulo: cobros (web)
      severidad: presentación
      detalle: >-
        En el DETALLE web de un cobro por RETENCIÓN (co_type=2, Ref 122) el campo de cabecera
        "Total Monto a pagar" muestra 0,0000 cuando el valor real es 12,00. La lista, la línea del documento
        y la BD (nu_amount_final) traen 12,00 correctamente. La cabecera parece calcular Σ(pagos) en vez de
        leer nu_amount_final, y un cobro por retención no tiene filas de pago. El móvil y la nube están bien.
    - id: VIS-GUARDAR-NO-IDEMPOTENTE
      modulo: visitas
      detalle: >-
        Un doble evento de "Guardar" sobre una visita aún no persistida crea DOS visitas Guardadas.
        Sugerido a desarrollo: guard de reentrada mientras el guardado está en vuelo.
    - id: PRD-BUSCADOR-NO-REPUEBLA
      modulo: productos
      detalle: >-
        Al VACIAR el buscador la lista no se repuebla: queda en 0 con "No hay productos disponibles",
        y sigue en 0 tras 8 s. Reproducido 2 veces. Contradice la nota de insumar de que el 0 es transitorio.
  defectos_conocidos_no_reproducidos:
    - "DM-DEP-018/019/020 (lista BUSCAR no renderiza tras guardar): NO reprodujo — renderizó limpia en los 3 accesos"
    - "DM-INV-026 (reabre en tab General): no observable, el ítem de lista no navega por CDP → BLOCKED de automatización"
    - "DM-VIS-020 permite Enviar sin firma pese a signatureVisit=true — 4.ª playa, reconfirmado sin re-marcar"
