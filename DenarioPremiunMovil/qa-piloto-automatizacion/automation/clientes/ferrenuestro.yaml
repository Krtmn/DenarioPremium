db_name: ferrenuestro                    # base del cliente en el RDS CENTRAL 'savia' (user_read compartido; NO es por-servidor). ⚠ 2026-07-24: la base EXISTE en savia pero le FALTA el GRANT read-only (permission-denied en tablas) → cotejo BD-N/A. ACCIÓN DBA: aplicar GRANT read-only a user_read sobre la base 'ferrenuestro'. (Ver automation/db/query.js — savia es central, no cambia por migración de playa.)
                                         # HISTÓRICO Isla Coche (2026-07-07): conexión read-only OPERATIVA; VGs VALIDADAS 1:1 contra BD viva (22 claves críticas, 0 discrepancias — global_configuration=170 VGs).
                                         # Baseline pre-corrida 2026-07-07 (BD Isla Coche): order=5005, collection=347, return=18, client_stock=0, deposit=0, visit=4, potential_client=87 (clients=3384, product=4965).
                                         # ⚠ Nombres de tabla: client (NO clients), order (reservada → usar "order"), collection, return (reservada → usar "return"), client_stock, deposit, visit, potential_client.

# ── VGs (fuente: dump dev global_configuration 2026-07-07; VERIFICAR vs UI en corrida) ──
# ⚠ DIFERENCIAS CLAVE que afectan cobertura del smoke:
#   - requiredCollectionAttachments=TRUE  → cobro REQUIERE adjunto → DM-COB-019/029 SKIP envío (quedan Guardados; adjunto manual QA)
#   - validateReturn=FALSE                → devoluciones NO valida que el producto exista en factura (requeridedNroFactura=true igual pide nro factura)
#   - clientStock=FALSE + requireClientStock=FALSE → módulo TOMA DE INVENTARIO EN CLIENTE NO habilitado → smoke Inventarios N/A ESTRUCTURAL (confirmar en UI)
#   - cobroRetencion=TRUE + retencion=TRUE→ AMBAS retenciones aplican: DM-COB-029 (botón +RETENCIÓN) Y DM-COB-041/042 (detalle documento)
#   - userCanSelectIGTF=FALSE             → DM-COB-036/044/045 N/A ESTRUCTURAL (sin selector IGTF)
#   - userCanCollectIva=FALSE             → DM-COB-037 (cobro 25% IVA) N/A ESTRUCTURAL
#   - enabledManualRate=TRUE / canChangeRate=FALSE → DM-COB-039 rama A (tasa manual) APLICA; DM-COB-047 (cambiar fecha tasa) N/A
#   - enterpriseEnabled=TRUE / userMustActivateGPS=FALSE / transportRole=FALSE
