#   **cada FORMULARIO** — en kron se midieron 4 en el mismo día: CLIENTES `disabled=true` auto-asignado ·
#   INVENTARIOS habilitado con objeto · DEPÓSITOS sin `formcontrolname` · VISITAS `disabled`.
#   ⇒ **no volver a marcar ⚠️VERIFICAR por esta combinación en ningún perfil.**

# ── 🔴 EL SLUG SE ESCRIBE DISTINTO SEGÚN EL ARCHIVO — LEER ANTES DE CORRER ────
#   perfil / base de datos / bloque de qa-db.env .... `kron`
#   bloque de qa-credentials.env ................... **`chocolates_kron`**
#   ⇒ El login NO se resuelve con el slug del perfil. Anclar al bloque
#     "# Cliente: chocolates_kron" o el agente no encuentra las credenciales.
#   📋 A alinear con QA: conviene que ambos bloques usen el mismo nombre.

# ── USUARIO QA ────────────────────────────────────────────────────────────────
#   Login (qa-credentials.env, bloque "# Cliente: chocolates_kron") → `scarlet`
#   Resolución en BD (✅ confirmada 2026-08-14):
