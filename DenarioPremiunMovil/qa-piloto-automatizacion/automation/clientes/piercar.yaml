  #    Criterio de elección, repetible en cualquier cliente:
  #      SELECT c.co_client, count(DISTINCT i.id_invoice) AS facturas,
  #             count(DISTINCT idt.id_invoice_detail) AS lineas,
  #             count(DISTINCT ac.id_address_client) AS sucursales
  #      FROM client c
  #      JOIN invoice i ON i.co_client = c.co_client
  #      JOIN invoice_detail idt ON idt.id_invoice = i.id_invoice
  #      LEFT JOIN address_client ac ON ac.co_client = c.co_client
  #      GROUP BY c.co_client HAVING count(DISTINCT ac.id_address_client) >= 1
  #      ORDER BY facturas DESC;
  # ══════════════════════════════════════════════════════════════════════════════
