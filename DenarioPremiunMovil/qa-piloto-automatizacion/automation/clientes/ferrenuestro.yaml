  enabledManualRate: true                # [dump] → DM-COB-039 rama A (tasa manual) APLICA
  canChangeRate: false                   # [dump] → ⚠ DM-COB-047 (cambiar fecha tasa) N/A
  validateCollectionDate: false          # [dump]
  multiCurrencyCollection: true          # [dump] → DM-COB-033/034 aplican
  multiCurrencyDeposit: true             # [dump]
  currencyBank: false                    # [dump] → solo bancos de la moneda seleccionada en el cobro
  clientBankAccount: false               # [dump]
  tolerancia0: true                      # [dump] → permite cobros con diferencia (tolerancia)
  TipoTolerancia: "0"                    # [dump] 0 = Importe
  MonedaTolerancia: "$"                  # [dump]
  RangoToleranciaPositiva: 100000        # [dump]
  RangoToleranciaNegativa: 100000        # [dump]
  userCanSelectCollectDiscount: true     # [dump] → descuentos en cobros habilitados → DM-COB-031 aplica
  enableDifferenceCodes: false           # [dump] → sin selector de origen de diferencia
  showTransactionCurrency: true          # [dump]
  showExchangeRateSelector: false        # [dump]
  reconciliation: false                  # [dump]
  streetDay: false                       # [dump]
  # colletionPayment (id78) = true-false-true-true-true-true → Efectivo, Transferencia, Deposito, Otros, Pago Movil (Cheque OFF)
  #   → Efectivo HABILITADO ⇒ módulo Depósitos APLICA (requiere cobro con Efectivo). multiCurrencyDeposit=true.

