cliente_nombre: "FERRENUESTRO MAYOR,"    # CONFIRMADO 2026-07-07: empresa única mostrada en detalle/selector (idEnterprise 1, coEnterprise "00001"). ⚠ el rótulo llega con COMA FINAL en el textContent del ion-select-option. enterpriseEnabled=true pero 1 sola empresa (sin gateway multi-empresa).
# ws_url: <ELIMINADO — desacople servidor↔cliente 2026-07-24>. El servidor NO se guarda en el perfil:
#   los clientes migran de playa según disponibilidad. Se DESCUBRE EN RUNTIME (host de los payloads/app).
