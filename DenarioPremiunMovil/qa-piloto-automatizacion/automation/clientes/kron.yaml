#      ✅ **Pero `incidence` SÍ es legible** ⇒ la actividad/motivo de la visita **sí se coteja**: no es BD-N/A.
#      ⚠ kron **no tiene `visit_incidence`**; las tablas de visitas son `visit`, `visit_cycles`,
#        `visit_planning`, `visit_view`. El catálogo de causa es **`incidence_motive`**, no `incidence_cause`.
#   ⚠ `deposit` **no tiene `co_user`** (el vendedor va por `id_user`) · el monto del pago es
#      **`nu_amount_partial`**, no `nu_amount` · `collection` no tiene `nu_rate` (la tasa es **`nu_value_local`**).
#   ⚠ `order_type` guarda `id_enterprise = NULL` ⇒ filtrar por `id_enterprise=1` devuelve 0 filas.
#   ⚠ `deposit_collection_payment` **VACÍA** ⇒ el vínculo es **`collection.id_deposit`** (guión ya corregido).
#   🔴 **Medir con `count(*)`, NUNCA con `max(id)`** — pasó 2 veces acá: "177 devoluciones" eran **3** y
#      "351 cobros" eran **72** (eran los id máximos). Contamina el alcance declarado de todo muestreo.

