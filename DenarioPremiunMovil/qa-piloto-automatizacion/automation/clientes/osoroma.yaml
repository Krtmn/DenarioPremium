#
# ⚠ DECISIÓN DE MERGE DE CONFIG (global vs client-override):
#   Se entregaron DOS dumps: global_configuration_...OSOROMA (tabla global) y global_configuration_client_...OSOROMA (override).
#   El override está congelado en 2022-10-17 con esquema legacy (contiene vars que ya NO existen en el global:
