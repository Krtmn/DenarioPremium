# latino_cosmetica/perfil.yaml
# Cliente LATINO COSMETICA — servidor La Tortuga. 1ª corrida automatizada COMPLETA 10/10 (RUN 20260714_130727).
# VGs construidas de los 2 dumps en clientes/ + CONFIRMADAS en corrida (se retiraron los ⚠️VERIFICAR resueltos):
#   - global_configuration_202607141224_LATINO COSMET.md      (principal, filas 2025-2026 → AUTORITATIVO)
#   - global_configuration_client_202607141225_LATINO COSMET.md (por-cliente, muchas filas 2022-10-17 → OVERRIDE STALE)
# ⚠ REGLA DE RESOLUCIÓN: cuando ambos difieren, gana el `da_update` más reciente (el global principal).
#   Conflictos 2022(client)=X vs global-reciente=Y quedaron RESUELTOS en la 1ª corrida (ver comentarios inline).

cliente_id: latino_cosmetica
cliente_nombre: "LATINOCOSMETICA C.A."       # ✅ confirmado en UI (app-client-detail Empresa + form potencial idEnterprise=1)
# ws_url: NO se guarda — la playa es del SERVIDOR y es rotativa; se descubre en runtime (ver _schema.yaml).
# playa_web: NO se registra — resolver la playa en runtime y elegir ahi el bloque '# USUARIO WEB' correspondiente.
apk_package: com.kiberno.denarioPremiumPro
db_name: latino                             # 🔴 LA BASE SE LLAMA `latino`, NO `latino_cosmetica` (confirmado 29/07/2026 con current_database()).
                                            #    `latino_cosmetica` es solo el ALIAS de cliente (el nombre del bloque en secrets/qa-db.env y el arg de query.js).
                                            #    ⇒ El GRANT read-only debe aplicarse sobre `latino`:  \c latino  → GRANT ... TO user_read;
                                            #    Un GRANT sobre "latino_cosmetica" NO hace nada: esa base no existe en el servidor.
                                            # DSN read-only en bloque "# Cliente: latino_cosmetica" de secrets/qa-db.env

# ── VGs — CONFIRMADAS en corrida 20260714 (conflictos 2022 vs global RESUELTOS por observación en UI) ──
vgs:
  multiCurrency: true                        # ✅ REAL true (BS+USD): lista y detalle de clientes muestran "Saldo BSD" Y "Saldo $"; selector Moneda cobro con 2 opciones. El override 2022=false NO aplica
  expirationBatch: false                     # → inventarios: Lote+Fecha SÍ se renderizan pero NO son obligatorios (Aceptar OK con vacíos, payload nuBatch=""). Divergencia UI-vs-config, VERIFICAR con desarrollo
  suggestedOrder: false
  suggestedOrderByDispatchAndReturn: false   # → PEDIDOS: botón "Pedido Sugerido" NO aparece (coherente). INVENTARIOS: botón PEDIDO SUGERIDO SÍ aparece (divergencia UI-vs-config, 4ª playa; VERIFICAR con desarrollo)
  clientStock: true                          # ✅ REAL true: módulo Inventarios operable end-to-end y persiste en nube (id_client_stock=7). Override 2022=false descartado. requireClientStock=false
  requiredCollectionAttachments: true        # 2026-07-03 → COBRO EXIGE ADJUNTO (DM-COB-019 no se salta). requiredAnticipoAttachments=true, requiredRetentionAttachments=true. ⚠ mock cámara NO funciona (ver modules.cobros)
  requiredComment: true                      # ✅ 2026-03-24 → comentario obligatorio en cobro; comentario vacío → ion-invalid + "¡Campo Obligatorio!" + tabs disabled. DM-COB-006 APLICA
  validateReturn: true                       # ✅ devoluciones validan producto vs factura → AGREGAR PRODUCTO lista los productos de la factura. requeridedNroFactura=true, multiInvoices=false (una factura por devolución)
  signatureReturn: true                      # ✅ acordeón Firma en Tab Adjuntos, PERO Guardar/Enviar proceden SIN firma (payload nuAttachments=0)
  signatureCollection: true
  signatureVisit: true                       # ✅ acordeón Firma presente PERO envío procede SIN firma (defecto conocido DM-VIS-020)
  signatureDeposit: true
  signatureStock: true                       # ✅ NO bloquea Enviar (sin pad de firma interactivo)
  signatureOrder: true
  signatureClient: true                      # ✅ RESUELTO: NO se materializa firma en cliente potencial — Guardar y Enviar proceden directo sin pedir firma
  userCanUploadFiles: true                   # ✅ acordeón Archivo en Adjuntos (devoluciones/visitas)
  esVendedor: true                           # ✅ confirmado (usuario 001): módulo Vendedores presente, heading <h1>Vendedor</h1>. infoVendedores global=true
  enterpriseEnabled: true                    # ✅ aplica en TODOS los módulos MENOS PEDIDOS (orderEnterpriseEnabled=false). Empresa ÚNICA "LATINOCOSMETICA C.A." idEnterprise=1 (no auto-selecciona, exige value numérico + ionChange)
  enabledManualRate: false                   # → DM-COB-039 rama A (tasa manual) N/A. Tasa read-only (667,05 BSD)
  cobroPrepago: true                         # ✅ ANTICIPO/PREPAGO aplica (DM-COB-028 co_type 1). requiredAnticipoAttachments=true
  cobroRetencion: true                       # ✅ botón +RETENCIÓN aplica (DM-COB-029 co_type 2 Guardado). requiredRetentionAttachments=true
  retencion: true                            # ✅ REAL true, VARIANTE dynamicRetentions (ver modules.cobros). Override 2022=false descartado. retentionDocTypeCR=true
  sizeRetention: 14                          # nro comprobante = 14 dígitos
  formatRetention: "0"                        # "0" = Números
  userCanSelectIGTF: true                    # ✅ REAL true (botón IGTF presente) PERO sin documento IGTF sincronizado hoy → DM-COB-036/044/045 N/A por DATO (no estructural). igtfDefault=false, disableCheckIGTF=false
  userCanCollectIva: false                   # ✅ confirmado: sin botón 25% IVA → DM-COB-037 N/A estructural
  transportRole: true
  userMustActivateGPS: true                  # ✅ presente PERO NO bloqueó ninguna transacción; coordenada real capturada (visitRout=true, userCanSaveGPS=true)

# ── Métodos de pago Cobros: colletionPayment = true-false-true-true-true-true (global reciente) ──────
