# Registro de DEFECTOS CONOCIDOS — Denario Premium (móvil + web)
#
# Para qué sirve: que el lector de corridas (`automation/reports/leer-corrida.js`) separe
#   "esto ya se sabe" de "🔎 esto es nuevo, míralo".
# Los DESCARTADOS se conservan a propósito: evitan que una corrida futura vuelva a levantarlos
#   como hallazgo y que alguien repita el análisis que ya se hizo.
#
# La versión es DOCUMENTACIÓN, no un gate: el lector nunca decide nada por ella.
# **Quién decide qué se reporta es la QA.**

meta:
  tag_en_prueba: "20"
  actualizado: "2026-07-28"
  triaje: "2026-07-28 con la responsable QA — de 8 quedaron 2 a confirmar, 1 en monitoreo, 1 cerrado y 4 descartados"

defectos:

  # ───────────────────── EN MONITOREO ─────────────────────
  - id: COB-RET-TOTAL-CERO
    titulo: 'Cobro por RETENCIÓN muestra "Total Monto a pagar" en 0,00 en el detalle web'
    capa: web
    modulo: cobros
    detectado_en: "tag 20"
    resuelto_en: "tag 21"
    estado: monitoreo          # ya reportado; la 21 no ha salido
    patron: 'total monto a pagar|ret[eé]n[a-z]*.*0,00|COB-RET-TOTAL-CERO'
    detalle: >-
      La lista, la línea del documento y la BD (`nu_amount_final`) traen el valor correcto; solo el campo de
      cabecera del detalle sale en 0. La cabecera parece calcular Σ(pagos), y un cobro por retención no tiene
      filas de pago.
    accion: "No reportar. Caso de regresión DW-COB-C09: confirmar que quede resuelto al liberarse el tag 21."

  # ───────────────────── CONFIRMADOS A MANO POR QA ─────────────────────
  - id: VIS-GUARDAR-NO-IDEMPOTENTE
    titulo: "Dos eventos de Guardar seguidos crean DOS visitas"
    capa: movil
    modulo: visitas
    detectado_en: "tag 20"
    estado: confirmado
    confirmado_por: "QA, manualmente, 2026-07-29"
    severidad: funcional
    probabilidad_en_uso_real: baja      # valoración de QA: "rebuscado" para que un cliente lo replique
    patron: 'idempotente|dos visitas|doble.*guardar|guard de reentrada'
    detalle: >-
      Dos toques rápidos sobre Guardar en una visita aún no persistida crean DOS visitas Guardadas idénticas
      (mismo cliente, misma fecha, ambas Ref 0). **Confirmado a mano por QA.** Las duplicadas quedan LOCALES:
      la nube no se ensucia. ⚠ Requiere un doble toque muy rápido — QA lo considera poco probable en uso real,
      pero es real.
    reproduccion: "Ver `## Pasos de reproducción` al final de este archivo."
    accion: >-
      Reportar a desarrollo con la valoración de probabilidad baja, para que priorice en consecuencia.
      Arreglo sugerido: guard de reentrada / deshabilitar Guardar mientras el guardado está en vuelo.

  - id: PRD-BUSCADOR-NO-REPUEBLA
    titulo: "Vaciar el buscador de productos NO repuebla la lista"
    capa: movil
    modulo: productos
    detectado_en: "tag 20"
    estado: confirmado
    confirmado_por: "QA, manualmente, 2026-07-29"
    severidad: funcional
    probabilidad_en_uso_real: alta      # vaciar el buscador es un gesto cotidiano
    patron: 'no repuebla|No hay productos disponibles|buscador.*vaci'
    detalle: >-
      Tras CUALQUIER búsqueda, al borrar todo el texto la lista queda en 0 ítems con "No hay productos
      disponibles" + "Por favor espere…" y NO se recupera.
      🔑 **Hipótesis DESCARTADA:** se sospechaba que solo fallaba cuando la búsqueda previa daba 0 resultados.
      QA lo probó y **falla en AMBOS escenarios** (con y sin resultados previos) ⇒ el defecto es más simple y
      más amplio: **vaciar el buscador nunca repuebla la lista**.
      Workaround: buscar otro término, o salir a estructuras y reentrar.
    reproduccion: "Ver `## Pasos de reproducción` al final de este archivo."
    accion: >-
      Reportar. A diferencia del de visitas, este SÍ es de alta probabilidad: vaciar el buscador para volver
      al catálogo completo es un gesto cotidiano de un vendedor.

  # ───────────────────── CERRADO ─────────────────────
  - id: COB-SYNC-DIFERIDA
    titulo: "El envío de cobros tardaba ~28-75 min en llegar a la nube"
    capa: movil
    modulo: cobros
    detectado_en: "tag 20"
    estado: corregido
    patron: 'sync diferida|collectionservice|latencia.*cobro'
    detalle: "Era específico del endpoint de cobros; los demás módulos sincronizaban de inmediato."
    accion: "Cerrado. Pendiente único: re-medir la latencia en la próxima corrida para confirmarlo con datos."

  # ───────────────────── DESCARTADOS (no volver a levantarlos) ─────────────────────
  - id: DEP-LISTA-NO-RENDERIZA
    titulo: "Lista BUSCAR de depósitos no renderiza tras guardar"
    capa: movil
    modulo: depositos
    casos: [DM-DEP-018, DM-DEP-019, DM-DEP-020]
    estado: descartado
    patron: 'DM-DEP-(018|019|020)|lista BUSCAR no renderiza|deposit\.service'
    accion: "DESCARTADO por QA (2026-07-28): no reprodujo — la lista renderizó limpia en los 3 accesos."

  - id: VIS-FIRMA-NO-OBLIGATORIA
    titulo: "Permite Enviar una visita sin firma con signatureVisit=true"
    capa: movil
    modulo: visitas
    casos: [DM-VIS-020]
    estado: no-es-defecto
    patron: 'enviar sin firma|signatureVisit|modal.*antes de validar'
    detalle: >-
      ⚠ LECTURA CORREGIDA POR QA: la VG dice "¿Desea HABILITAR la firma en el módulo de visitas? SI: se PODRÁ
      firmar". Habilita la función, NO la vuelve obligatoria ⇒ enviar sin firma es comportamiento correcto.
    accion: "NO es defecto. No volver a levantarlo en ninguna playa."

  - id: INV-REABRE-TAB-GENERAL
    titulo: "Formulario Guardado de inventario reabre en tab General"
    capa: movil
    modulo: inventarios
    casos: [DM-INV-026]
    estado: descartado
    patron: 'DM-INV-026|tab General en lugar de|reabre en tab'
    accion: "DESCARTADO por QA (2026-07-28): cosmético, sin quejas de usuarios."

  - id: PED-SUGERIDO-VG-FALSE
    titulo: 'Botón "Pedido Sugerido" aparece pese a suggestedOrderByDispatchAndReturn=false'
    capa: movil
    modulo: pedidos
    estado: no-es-defecto
    patron: 'pedido sugerido|suggestedOrder'
    detalle: "Observado en 5 playas. Lo gobierna otra VG (`suggestedOrder`=true), no la que se estaba mirando."
    accion: "NO es defecto. Si se quiere, corregir la expectativa en los YAML."

---
# ═══════════════════════════════════════════════════════════════════════════
# Pasos de reproducción manual — para los dos que quedaron a confirmar
# ═══════════════════════════════════════════════════════════════════════════
#
# ── VIS-GUARDAR-NO-IDEMPOTENTE ────────────────────────────────────────────
# 1. App → módulo VISITAS → "NUEVA VISITA" (o el tile equivalente).
# 2. Seleccionar el cliente (ej. ABASTOS Y CARNICERIA HERMANOS FLORES CA).
# 3. Tab Actividades → elegir una actividad (ej. COBRANZA) y esperar ~2 s a que
#    carguen los motivos → elegir un motivo (ej. COBRANZA EFECTIVA).
# 4. Escribir una descripción cualquiera.
# 5. 🎯 EL PASO CLAVE: dar **DOS TOQUES LO MÁS RÁPIDO POSIBLE** sobre el ícono
#    de GUARDAR (el disquete de la barra superior, `.imagenGuardar`).
# 6. Volver a la lista de visitas y buscar en GUARDADAS.
#    · CORRECTO  → 1 sola visita.
#    · DEFECTO   → 2 visitas idénticas (mismo cliente, misma fecha, ambas sin Nro.Ref).
#
# ⚠ Puede costar reproducirlo: los dos clicks de la automatización fueron casi
#   simultáneos, más rápido que un doble toque humano. Si no sale al primer intento,
#   probar con el teléfono cargado de apps (más lento) o repetir varias veces.
# ℹ Las duplicadas quedan SOLO EN EL DISPOSITIVO (nunca se envían), así que la prueba
#   no ensucia la nube. Borrar la sobrante con el ícono de papelera.
#
# ── PRD-BUSCADOR-NO-REPUEBLA ──────────────────────────────────────────────
# ✅ CONFIRMADO por QA (2026-07-29) en LOS DOS escenarios.
#
# 1. App → módulo PRODUCTOS → entrar a una estructura (ej. EMBUTIDOS).
#    Debe listar productos (unos 50).
# 2. Buscar CUALQUIER término + Enter. Da igual que traiga resultados
#    (`COSTILLA`) o que no traiga ninguno (`ZZZZZZZ`).
# 3. 🎯 BORRAR TODO el texto del buscador (backspace hasta vaciarlo) + Enter.
#    · ESPERADO → vuelven a listarse los ~50 productos.
#    · REAL     → queda en "No hay productos disponibles" / "Por favor espere…"
#                 y NO se recupera.
#
# 🔑 La hipótesis de que solo fallaba tras una búsqueda vacía quedó DESCARTADA:
#    falla siempre. El defecto es simple — vaciar el buscador nunca repuebla.
# ℹ Workaround: buscar otro término, o salir a estructuras y volver a entrar.
