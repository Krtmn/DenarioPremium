name: Clientes unit tests

on:
  pull_request:
    paths:
      - 'DenarioPremiunMovil/src/app/services/clientes/**'
      - 'DenarioPremiunMovil/src/app/clientes/**'
      - 'DenarioPremiunMovil/package.json'
      - 'DenarioPremiunMovil/angular.json'
      - 'DenarioPremiunMovil/karma.conf.js'
      - '.github/workflows/clientes-unit.yml'
  workflow_dispatch:

jobs:
  test-clientes:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: DenarioPremiunMovil
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: DenarioPremiunMovil/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run Clientes unit tests
        run: npm run test:clientes
