# Registro de DEFECTOS CONOCIDOS — Denario Premium (móvil + web)
#
# Para qué sirve: que el lector de corridas (`automation/reports/leer-corrida.js`) separe
#   "esto ya se sabe" de "🔎 esto es nuevo, míralo".
# Sin este registro, cada corrida vuelve a levantar los mismos defectos y la QA pierde tiempo
#   revisando cosas ya reportadas o ya resueltas.
#
# ⚠ AL AGREGAR UNO: poné un `patron` (regex, sin distinguir mayúsculas) que matchee cómo lo
#   describen los agentes en sus reportes. Es lo que permite el cruce automático.

meta:
  # La versión es DOCUMENTACIÓN, no un gate: el lector nunca decide nada por ella.
  # Sirve para ubicar cuándo se vio un defecto; **quién decide qué se reporta es la QA**.
  # (Los identificadores no están unificados: la corrida expone `app_version: "1.0"` y
  #  `db_version: 19`, y `RUNTIME §5` habla de `v6.6.14`. No hace falta resolverlo.)
  tag_en_prueba: "20"
  actualizado: "2026-07-28"

defectos:

  - id: COB-RET-TOTAL-CERO
    titulo: 'Cobro por RETENCIÓN muestra "Total Monto a pagar" en 0,00 en el detalle web'
    capa: web
    modulo: cobros
    detectado_en: "v20"
    resuelto_en: "v21"
    estado: resuelto-sin-liberar        # la v21 aún no salió
    severidad: presentación
    patron: 'total monto a pagar|ret[eé]n[a-z]*.*0,00|COB-RET-TOTAL-CERO'
    detalle: >-
      La lista, la línea del documento y la BD (`nu_amount_final`) traen el valor correcto; solo el campo de
      cabecera del detalle sale en 0. La cabecera parece calcular Σ(pagos), y un cobro por retención no tiene
      filas de pago. Confirmado por QA como conocido de la v20.
    accion: "No reportar. Verificar que quede resuelto cuando se libere la v21."

  - id: DEP-LISTA-NO-RENDERIZA
    titulo: "Lista BUSCAR de depósitos no renderiza tras guardar"
    capa: movil
    modulo: depositos
    casos: [DM-DEP-018, DM-DEP-019, DM-DEP-020]
    detectado_en: "v6.6.14"
    estado: abierto
    severidad: funcional
    patron: 'DM-DEP-(018|019|020)|lista BUSCAR no renderiza|deposit\.service'
    detalle: "Bug en `deposit.service.ts`. Es intermitente (race): en el_valle-20260728 NO reprodujo."
    accion: "No re-marcar FAIL. Si reaparece, anotar en qué condiciones."

  - id: VIS-MODAL-ANTES-VALIDAR
    titulo: "Modal de confirmación de envío aparece antes de validar actividades"
    capa: movil
    modulo: visitas
    casos: [DM-VIS-020]
    detectado_en: "v6.6.14"
    estado: abierto
    severidad: UX
    patron: 'DM-VIS-020|modal.*antes de validar|enviar sin firma'
    detalle: >-
      UX, no bloquea. ⚠ En 4 playas se observó además que permite Enviar SIN FIRMA pese a
      `signatureVisit=true` — eso es más grave que el modal y conviene tratarlo aparte.
    accion: "No re-marcar FAIL por el modal. El 'enviar sin firma' SÍ merece reporte propio."

  - id: INV-REABRE-TAB-GENERAL
    titulo: "Formulario Guardado de inventario reabre en tab General en vez de Inventario"
    capa: movil
    modulo: inventarios
    casos: [DM-INV-026]
    detectado_en: "v6.6.14"
    estado: abierto
    severidad: UX
    patron: 'DM-INV-026|tab General en lugar de|reabre en tab'
    accion: "No re-marcar FAIL."

  - id: PED-SUGERIDO-VG-FALSE
    titulo: 'Botón "Pedido Sugerido" aparece pese a la VG en false'
    capa: movil
    modulo: pedidos
    detectado_en: "recurrente"
    estado: en-observacion
    severidad: por-determinar
    patron: 'pedido sugerido|suggestedOrder'
    detalle: >-
      Observado en 5 playas. Hipótesis del agente: la VG que gobierna el botón sería `suggestedOrder`
      (=true) y no `suggestedOrderByDispatchAndReturn` (=false). ⚠ NO confirmado con desarrollo.
    accion: "Confirmar con desarrollo qué VG lo gobierna, y recién ahí corregir los YAML o abrir defecto."

  - id: VIS-GUARDAR-NO-IDEMPOTENTE
    titulo: "guardar() de visitas no es idempotente: doble evento crea DOS visitas"
    capa: movil
    modulo: visitas
    detectado_en: "v20"
    estado: reportado
    severidad: funcional
    patron: 'idempotente|dos visitas|doble.*guardar|guard de reentrada'
    detalle: >-
      Detectado en el_valle-20260728. Se disparó por un artefacto de automatización (click sintético + real),
      pero el comportamiento de fondo es real: un doble-tap en campo duplicaría la visita.
    accion: "Sugerido a desarrollo: guard de reentrada mientras el guardado está en vuelo."

  - id: PRD-BUSCADOR-NO-REPUEBLA
    titulo: "El buscador de productos no repuebla la lista al vaciarse"
    capa: movil
    modulo: productos
    detectado_en: "v20"
    estado: reportado
    severidad: funcional
    patron: 'no repuebla|No hay productos disponibles|buscador.*vaci'
    detalle: >-
      Queda en 0 con "No hay productos disponibles" y sigue en 0 tras 8 s. Reproducido 2 veces en
      el_valle-20260728. Contradice la nota de insumar de que el 0 es transitorio.
    accion: "Reportar si se reproduce en otra playa."

  - id: COB-SYNC-DIFERIDA
    titulo: "El envío de cobros tardaba ~28-75 min en llegar a la nube"
    capa: movil
    modulo: cobros
    detectado_en: "v20"
    estado: corregido
    severidad: funcional
    patron: 'sync diferida|collectionservice|cobros no.*(llegan|env[ií]an)|latencia.*cobro'
    detalle: >-
      Pedidos, devoluciones, inventarios y depósitos sincronizaban de inmediato en la misma sesión ⇒ era
      específico del endpoint de cobros. Desarrollo aplicó un arreglo el 2026-07-28.
    accion: "⚠ FALTA re-medir la latencia para confirmar el arreglo con datos."
