# playas.yaml — URL de la web de Denario Premium por PLAYA (servidor).
#
# ⚠ Es propiedad del SERVIDOR, no del cliente. Los clientes migran de playa según disponibilidad
#   (ver el banner de desacople en automation/clientes/_schema.yaml). La playa efectiva de una corrida
#   se DESCUBRE EN RUNTIME (host de los payloads capturados por el móvil) y se resuelve contra esta tabla.
#
# Credenciales: bloque "# USUARIO WEB" de secrets/qa-credentials.env. NUNCA escribirlas aquí.
#
# 🔴 CONFIRMADO 2026-07-28: **la clave del usuario web es DISTINTA POR PLAYA.**
#   El mismo usuario `admin` que entra en Isla Coche devuelve "USUARIO INVALIDO" en La Tortuga.
#   ⇒ un solo bloque "# USUARIO WEB" NO alcanza. El archivo necesita un bloque POR PLAYA:
#       # USUARIO WEB: el_yaque
#       # USUARIO WEB: isla_coche
#       # USUARIO WEB: la_tortuga
#   y el agente web debe anclar al bloque de la playa que descubrió en runtime.
#   Mientras falte la clave de una playa → WEB-N/A para los clientes montados ahí (nunca FAIL).
#
# Verificado 2026-07-28: las 3 responden HTTP 200 desde la laptop QA, sin VPN.

playas:
  el_yaque:
    nombre: "El Yaque"
    base:   "http://denarioelyaque.ddns.net:8080/DenarioPremium"
  isla_coche:
    nombre: "Isla Coche"
    base:   "http://denarioislacoche.ddns.net:8080/DenarioPremium"
    # Empresa observada 2026-07-28: CAPITALINA DE ALIMENTOS 212, C.A.
  # ✅ CARIBE OPERATIVA de nuevo — verificado 2026-09-02 en corrida real.
  #   `/DenarioPremium` responde **HTTP 302** (redirige a login) y la sesión entra sin
  #   problema con el bloque "# USUARIO WEB ISLA COCHE / LA TORTUGA / EL YAQUE / CARIBE".
  #   Se consultaron /pages/inventarios, /pages/detalleInventario, /pages/pedidos y
  #   /pages/detallePedido: todo con datos y tiempos normales.
  #   ⚠ La raíz `:8080/` sigue dando 404 — eso es normal y NO indica caída: la app vive
  #     bajo /DenarioPremium. Medir la salud SIEMPRE contra esa ruta, no contra la raíz.
  #     (Fue lo que llevó a darla por caída el 13/08.)
  #
  # 🕐 HISTÓRICO — 2026-08-13 al 2026-09-01: FUERA DE SERVICIO, HTTP 404 en :8080;
  #   Tomcat levantado pero la app no desplegada. Resuelto sin fecha exacta conocida.
  #
  #   👤 Cliente actual: **HIDROPONIAS VENEZOLANAS C.A** (`HIDRO_A`), vendedor `vendedor4`.
  #      ⚠ Esto CONVIVE con la nota de abajo sobre COVADONGA (agosto): la playa cambió de
  #        cliente. Leer la empresa en runtime antes de dar por buena cualquier nota previa.
  caribe:
    nombre: "Caribe"
    base:   "http://denariocaribe.ddns.net:8080/DenarioPremium"
    # 🆕 Playa NUEVA — servidor QA de pruebas, informada por QA el 03/08/2026. Reconocida ese mismo día:
    #   · Empresa ÚNICA: "PROCESADORA DE ALIMENTOS COVADONGA,C.A" — cliente NUEVO, sin perfil propio todavía.
    #     ⚠ El código de la empresa CAMBIA según la pantalla: vale `00001` en /pages/pedidos y `1` en
    #       /pages/cobros, /pages/clientes y /pages/visitas. Mismo nombre, distinto value.
    #     ⚠ El placeholder "Seleccione Empresa" existe en Clientes y Visitas, pero NO en Pedidos ni Cobros.
    #   · Credenciales: entra con el bloque "# USUARIO WEB ISLA COCHE Y LA TORTUGA" (no hace falta uno propio).
    #   · Build: `common.css` del 31/07/2026 13:38 GMT — el MÁS NUEVO de las 3 playas
    #     (La Tortuga 16/07 · Isla Coche 23/07). ⚠ La URL correcta de la huella es
    #     /DenarioPremium/javax.faces.resource/common.css.xhtml?ln=css  (SIN el `css/` intermedio, que da 404).
    #   · Datos: maestros de volumen REAL (5.384 clientes, 14 vendedores) pero transaccional MUY FLACO
    #     (440 pedidos · 17 cobros · 35 visitas en TODO 2026; los # Ref más altos confirman que es el histórico
    #     completo). Sirve para lectura, filtros, maestros y reportes; NO para volumen ni histórico multi-año.
    #   · Menú: sin pantallas nuevas de valor. El delta contra smoke-web-extendido.md son 6 entradas y las 6
    #     caen dentro de Configuración (zona que no se toca). Falta /pages/protected/indicadores/pedidosProductosVentas.xhtml,
    #     que el guión sí lista.
    #   🔴 Defecto conocido REPRODUCIDO acá: el filtro `Coordenadas = No Realizado` de Visitas devuelve 0
    #      cuando la tabla muestra 29 filas con ese valor ⇒ **el build más nuevo NO tiene ese fix**.
    #   ✅ RESUELTO 2026-08-03 — la supuesta "trampa del `Buscar` atrasado" NO EXISTE. Se creyó que el listado
    #      iba un `Buscar` atrás del filtro; instrumentando el fin REAL del ajax (hook sobre XMLHttpRequest →
    #      `loadend`, en vez de esperas fijas) el filtro de fechas ACIERTA AL PRIMER `Buscar`, siempre.
    #      Lo que pasa es que /pages/pedidos tarda ~25 s en responder (4 s con 2 filas · 25,1 s con 205 ·
    #      24,5 s con 440) y SIN spinner visible: con una espera de 4 s se lee la tabla antes de que llegue la
    #      respuesta y se ve todavía el resultado anterior — que es real, y por eso parecía coherente.
    #      ⇒ Regla para automatización: enganchar el fin del ajax, NUNCA dormir un tiempo fijo.
    #      ⚠ Dos artefactos de automatización descubiertos de paso (no son defectos del producto):
    #        1. Setear la fecha con `el.value = ...` NO funciona: el widget PrimeFaces conserva su fecha interna
    #           y revierte el input. Hay que usar `widget.setDate()` o el calendario.
    #        2. `jQuery(document).ajaxComplete` NO dispara en esta página; hay que enganchar XMLHttpRequest.
    #      ⚠ Lo que SÍ queda como observación real: ~25 s por consulta con sólo 440 registros y sin indicador
    #        de carga (CAR-PED-PERF). Facturaciones responde en ~2 s con más registros ⇒ es puntual de pedidos.
    #   ⚠ RUTAS SIN EXTENSIÓN: `/pages/pedidos` funciona, `/pages/pedidos.xhtml` da HTTP 404. El login SÍ es
    #      `/pages/login.xhtml`.
    #   ⚠ BASELINE `document_sale`: los 2.783 registros incluyen **2.048 borrados lógicos** (`co_operation='D'`,
    #      el 73,6 %). Los vigentes son **735**, que es lo que la web muestra — correctamente. Medir SIEMPRE con
    #      `WHERE co_operation <> 'D'`. Esto explica el defecto D-02 de El Valle ("lista 2.783 vs 735"): la web
    #      hace lo correcto.
    #   ⚠ Zona horaria a verificar: `gmap.js` reporta 6 h exactas de diferencia contra las otras dos playas.
    #      Importa porque los cotejos móvil↔web comparan fecha y hora.
  la_tortuga:
    nombre: "La Tortuga"
    base:   "http://denariolatortuga.ddns.net:8080/DenarioPremium"

# Rutas — IGUALES en las 3 playas (se concatenan a `base`).
# ✅ Verificado: la navegación DIRECTA por URL funciona con sesión activa (no hay ViewExpired).
rutas:
  login:                "/pages/login.xhtml"
  home:                 "/pages/main"
  # Los 7 transaccionales del alcance (menú "Transacciones", salvo visitas)
  pedidos:              "/pages/pedidos"
  cobros:               "/pages/cobros"
  devoluciones:         "/pages/devoluciones"
  depositos:            "/pages/depositos"
  clientes_potenciales: "/pages/clientesPotenciales"
  inventarios:          "/pages/inventarios"
  visitas:              "/pages/visitas"          # menú "Visitas" → "Reporte de Visitas"
  # Detalle (se llega por el botón Consultar de la fila, NO por URL directa sin contexto)
  detalle_cobro:        "/pages/detalleCobro"
  # Fuera de alcance por ahora (existen, no se validan): facturaciones, productos, clientes,
  # documentos, reportes/*, indicadores/*, empresa/*, estructura*/*
