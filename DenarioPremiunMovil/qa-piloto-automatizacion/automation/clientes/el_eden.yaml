# ── Variables Globales ──────────────────────────────────────────────────────
# Fuente: global_configuration + global_configuration_client
# PRECEDENCIA: si la clave existe en AMBAS tablas → gana el valor de global_configuration
#   (confirmado en device 2026-08-26: userCanSelectIGTF y userCanChangePriceList usan el GLOBAL,
#    no el override del cliente). NO tomar el override cuando difiere del global.
# Consultado: 2026-08-20 · Precedencia validada en device: 2026-08-26
vgs:
  multiCurrency: true
  expirationBatch: false
  suggestedOrderByDispatchAndReturn: false
  requiredCollectionAttachments: true   # DM-COB-019 requiere adjunto manual en APK
  requiredComment: false
  validateReturn: false
  signatureReturn: true
  signatureCollection: true
  signatureVisit: true
  userCanUploadFiles: true
  esVendedor: true
  enterpriseEnabled: true              # GLOBAL=true gana sobre override cliente=false (era 'false', mal). ⚠ CONFIRMAR EN DEVICE
  enabledManualRate: false
  cobroPrepago: true
  cobroRetencion: true
  retencion: true
  sizeRetention: 14
  formatRetention: alfanumerico        # formatRetention=0 → alfanumérico
  userCanSelectIGTF: false             # GLOBAL=false gana sobre override cliente=true → IGTF INACTIVO en app (device 2026-08-26). co_type 3 N/A.
  userCanCollectIva: false             # 25% IVA off
  # ── VGs adicionales de cobros (global, validadas 2026-08-26) ──
  retentionDocTypeCR: true             # documentos de retención permiten pagos parciales
  userCanAddRetention: true            # retenciones libres sin factura permitidas
  multiCurrencyCollection: true        # selector de moneda en cobros (US$/BS)
  requiredRetentionAttachments: false  # retención NO exige adjunto
  requiredAnticipoAttachments: false   # anticipo NO exige adjunto
  validateCollectionDate: true         # fecha tasa = fecha depósito/transferencia
  # ── Tolerancia de cobros (global, validada BD 2026-08-26) ──
  tolerancia0: true                    # GLOBAL=true gana sobre override cliente=false → SÍ se permite diferencia. ⚠ CONFIRMAR EN DEVICE (behavioral)
  TipoTolerancia: 0                    # 0 = por importe (monto absoluto); ≠0 = por rango (%)
  MonedaTolerancia: "US$"              # la tolerancia se evalúa en US$ (si el cobro es en otra moneda, se convierte)
  RangoToleranciaPositiva: 10          # diferencia positiva (sobra) permitida: amount < 10
  RangoToleranciaNegativa: 10          # diferencia negativa (falta) permitida: |amount| <= 10
  # ── Anticipo automático (global, BD 2026-08-26) ──
  automatedPrepaid: true               # ACTIVO: excedente del cobro → anticipo automático (solo co_type 0, no pago parcial)
  prepaidRangeAmount: 11               # umbral: si excedente >= 11 → crea anticipo automático
  prepaidCurrency: "US$"               # moneda del anticipo automático
  prepaidRangeCurrency: "US$"          # moneda en que se evalúa el umbral
  parteDecimal: 2                      # 2 decimales
  # ── Pagos parciales (global) ──
  enablePartialPayment: true           # pagos parciales habilitados
  alwaysPartialPayment: false          # no forzar pago parcial siempre
  historicPartialPayment: true         # histórico de pagos parciales
  # ── Tasa / conversión (global) ──
  canChangeRate: true                  # el usuario puede cambiar la tasa
  historicoTasa: true                  # usa histórico de tasa
  currencyModule: true                 # módulo multi-moneda activo
  # ── Métodos de pago (colletionPayment, global gana) ──
  # items: Efectivo,Cheque,Transferencia,Deposito,Otros,Pago Movil
  # global "true-false-true-true-true-true" → Efectivo✓ Cheque✗ Transferencia✓ Deposito✓ Otros✓ PagoMovil✓
  colletionPayment: "true-false-true-true-true-true"
  clientBankAccount: false             # no usa cuenta bancaria del cliente
  currencyBank: false
  # ── Descuentos / códigos de diferencia (global) ──
  userCanSelectCollectDiscount: false  # no permite descuento en cobro
  enableDifferenceCodes: true          # códigos de diferencia habilitados (al cobrar con diferencia)
  # ── Retención extra (global) ──
  dynamicRetentions: false             # usa retenciones fijas (IVA/ISLR), no dinámicas
  missingRetention: false              # sin selector de falta retención
  alwaysRetention: false
  # ── IGTF (global; ver userCanSelectIGTF=false arriba) ──
  igtfDefault: false
  disableCheckIGTF: false
  transportRole: false
  userMustActivateGPS: true

