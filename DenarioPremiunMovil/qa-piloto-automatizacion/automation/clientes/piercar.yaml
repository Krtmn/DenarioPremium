  #            las pestañas**. Comprobado en device 2026-08-31 con RAFAEL PIT STOP:
  #            tras cliente → PRODUCTOS disabled=true; tras factura 10056 → false.
  #
  #    ⇒ PIERCAR ES TIPO B. El cliente de prueba DEBE tener facturas activas con
  #      productos devolvibles, o el módulo entero queda inejecutable.
