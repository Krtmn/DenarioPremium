#      ped: co_status='env' → id_status 1 (1.382) · 6 (1)
#      dev: co_status='env' → id_status 18 (1)
#      inv: co_status='env' → id_status 4 (1) · 9 (1)
#      dep: **sin filas**   ·  vis: **sin filas**
#    ⚠ id_status=1 aparece en 'cob' Y en 'ped' ⇒ usar co_status, nunca el id solo.
#    ⚠ Para DEPÓSITOS y VISITAS no hay filas ⇒ para visitas el oráculo es `visit.st_visit`.
#
# Catálogo `statuses` (POR EMPRESA — referencia, NO para traducir):
#   DDHP_A12    : ped 6=env/26=pap · cob 7=env/27=pap · dev 8=env/28=pap · inv 9=env/29=pap · dep 10=env/30=pap
#   DIF_A12     : ped 1/21 · cob 2/22 · dev 3/23 · inv 4/24 · dep 5/25
#   DHVITAL01_A : ped 16/36 · cob 17/37 · dev 18/38 · inv 19/39 · dep 20/40
#   ⚠ No hay filas para 'vis' (visitas) en ninguna empresa.

# ── 🔴 co_type de COBROS en esta BD ───────────────────────────────────────────
#   co_type=0 → 19.510 cobros  — cobro normal
#   co_type=1 →    257 cobros  — anticipo / prepago
#   co_type=2 →      3 cobros  — retención  (ids 1590, ~21829)
#   co_type=3 →      1 cobro   — IGTF       (id 21831)
#   co_type=4 →      0 cobros  — Cobro 25%  ⇒ inexistente, coherente con userCanCollectIva=false
# ⚠ Los rótulos salen GRATIS del `<select id$=":idTipo_input">` de /pages/cobros en la web
#   (más barato y fiable que el catálogo `statuses`).
# 🔴 EL ORÁCULO DE LA CABECERA ES POR co_type — usar el equivocado da falsos positivos:
#    co_type 0: Total a pagar = Σ(Saldo doc) − Total dcto − (Ret.IVA+Ret.ISLR) − Σ(Dif/Faltante) + IGTF
#    co_type 2: Total a pagar = Σ(Monto a pagar por doc) = Ret.IVA + Ret.ISLR  ← el saldo NO participa

# ── Tasa de cambio ────────────────────────────────────────────────────────────
# 🔴 DOS TABLAS, UNA MIENTE:
#   · `currency_relation` → nu_exchange_rate = **1.0000** en las 4 filas (última 2025-03-07).
#     NO es la tasa operativa. Si se usa esta, multiplicar y dividir dan el mismo número y
#     cualquier defecto de conversión queda invisible ⇒ conclusión falsa.
#   · `conversion_type`   → **la tasa real**: US$→BSD = 748,79 (2026-08-03) y 752,09 (2026-08-04),
#     por empresa, actualizada a diario. 3.491 filas.
#   ⇒ Para cualquier oráculo de conversión usar **`conversion_type.nu_value_local`**.
# `conversions` (6 filas, creadas el 2026-08-04): 2 tipos de tasa por empresa —
#   **BCV** (primary_currency=true) y **PRL** "Tasa Paralelo". Con showExchangeRateSelector=false
#   y canChangeRate=false, ⚠️VERIFICAR si el vendedor puede elegir entre BCV y Paralelo.

# ── Catálogos auxiliares (BD read-only, 2026-08-07) ───────────────────────────
# TIPOS DE DEVOLUCIÓN (`return_type`) — solo **3 ACTIVOS**: 52 PostVenta · 59 Servicio · 60 Calidad
