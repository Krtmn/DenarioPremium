# _schema.yaml — Esquema de perfil de cliente QA
# Cada cliente tiene su perfil: automation/clientes/{cliente_id}.yaml
#
# ⚠ DESACOPLE SERVIDOR↔CLIENTE (2026-07): el SERVIDOR (playa/ws_url) NO se guarda en el perfil.
#   Los clientes NO están fijos a un servidor — migran según disponibilidad. El servidor efectivo
#   es el que tenga configurado el APK en el momento de la corrida y se DESCUBRE EN RUNTIME
#   (host observado en los payloads / la config de la app), no se hardcodea aquí. Guardar el ws_url
#   en el perfil solo genera valores stale (causó el cotejo BD caído en ferrenuestro 20260723).
#
# ⚠ BD: es un ÚNICO RDS central 'savia' + usuario 'user_read' COMPARTIDOS por todos los clientes
#   (ver automation/db/query.js). Lo único por-cliente es el NOMBRE DE LA BASE (db_name) — que SÍ es
#   propiedad del cliente. Las bases son transitorias (el equipo las cicla) → si la base no existe o
#   falta el grant, el cotejo es BD-N/A (acción DBA), no un problema del perfil.

# ── Identificación ────────────────────────────────────────────────────────────
cliente_id: string        # [REQUERIDO] slug único, ej: hidroponias, romher, insumar
cliente_nombre: string    # [REQUERIDO] nombre de la empresa en la app (⚠ confirmar en corrida)
apk_package: string       # [REQUERIDO] com.kiberno.denarioPremiumPro
db_name: string           # [REQUERIDO] nombre de la BASE del cliente en savia (ej. insumar, dm_electronica,
                          #   latino [≠slug latino_cosmetica], RUN_P1). Es propiedad del cliente, NO del servidor.
# ws_url: <ELIMINADO>     # ⚠ NO guardar el servidor en el perfil — se descubre en runtime (ver banner arriba).
#                         #   Si se quiere registrar la playa observada, va en el REPORTE de la corrida, no aquí.

# ── Variables Globales activas para este cliente ──────────────────────────────
# Verificar con el equipo de desarrollo si hay dudas sobre un valor.
# Actualizar cuando el cliente solicite cambios de configuración.
vgs:
  multiCurrency: bool
  expirationBatch: bool
  suggestedOrderByDispatchAndReturn: bool
  requiredCollectionAttachments: bool   # si true → DM-COB-019 requiere adjunto manual en APK prod
  requiredComment: bool
  validateReturn: bool
  signatureReturn: bool
  signatureCollection: bool
  signatureVisit: bool
  userCanUploadFiles: bool
  esVendedor: bool
  enterpriseEnabled: bool
  enabledManualRate: bool
  cobroPrepago: bool
  cobroRetencion: bool               # muestra botón RETENCIÓN en home cobros (tipo retención)
  retencion: bool                    # habilita retención en detalle de documento dentro de cobro normal → DM-COB-041/042
  sizeRetention: int                 # longitud requerida del nro. comprobante (8, 14 o 16 — leer de UI)
  formatRetention: string            # tipo/formato de comprobante (alfanumérico, solo dígitos, etc.)
  userCanSelectIGTF: bool
  userCanCollectIva: bool
  transportRole: bool
  userMustActivateGPS: bool

# ── Datos de prueba por módulo ────────────────────────────────────────────────
modules:
  login:
    bad_password: string

  clientes:
    cliente_busqueda: string
    cliente_detalle: string

  pedidos:
    cliente_test: string
    estructura_producto: string
    alerta_deuda_vencida: bool

  cobros:
    cliente_test: string          # cliente para casos SIN documentos (001,002,004,006,020/021/038)
    cliente_code: string
    clientes_con_documentos: []   # códigos con factura pendiente en cobro normal — casos que requieren factura (007/008/012/040/041/042/043/044/046). Si vacío o ninguno hoy → el agente recorre la lista del modal hasta hallar uno
    cliente_25iva: string         # código habilitado para cobro 25% IVA (config web por cliente) → DM-COB-037; vacío/ausente si ninguno habilitado
    metodo_pago: string           # deposito | efectivo | transferencia
    banco_deposito: string        # si metodo_pago=deposito
    documento_retencion: string   # nro de factura en rojo para DM-COB-041/042 (si vgs.retencion=true)
    monto_retencion_iva: number   # monto IVA a retener en DM-COB-041 (ej. 10)
    monto_retencion_islr: number  # monto ISLR a retener en DM-COB-041 (ej. 1)
    moneda_cobro: string          # moneda para DM-COB-041/042 (USD | VED | BS)
    smoke_na_estructural: []      # IDs siempre N/A por VGs de este cliente

  devoluciones:
    cliente_test: string
    factura_test: string
    producto_test: string

  inventarios:
    cliente_test: string
    cliente_code: string

  depositos:
    aplica: bool
    motivo_na: string             # si aplica=false

  visitas:
    cliente_test: string
    smoke_na_estructural: []

  productos:
    tipo_estructura_default: string
    texto_busqueda: string

  vendedores:
    aplica: bool

# ── Última corrida ────────────────────────────────────────────────────────────
ultima_corrida:
  run_id: string
  fecha: string
  defectos_abiertos: []
