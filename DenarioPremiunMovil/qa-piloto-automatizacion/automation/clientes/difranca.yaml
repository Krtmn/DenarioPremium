# ── Variables Globales ──────────────────────────────────────────────────────
# Fuente: global_configuration + global_configuration_client (client overrides global)
# Consultado: 2026-08-21
# Overrides relevantes aplicados:
#   expirationBatch: global=true → cliente=false
#   sizeRetention: global=0 → cliente=14
#   retentionDocTypeCR: global=true → cliente=false
#   stock0: global=true → cliente=false
#   suggestedOrder: global=false → cliente=true
#   validateWarehouses: global=true → cliente=false
#   listProductsBy: cliente=lineas
#   productMinMul: cliente=true
#   requireClientStock/clientStock: cliente=true
#   conversionByPriceList: cliente=true
#   hideColletionPayment: cliente=true
vgs:
  multiCurrency: true
  expirationBatch: false                      # override cliente (global=true)
  suggestedOrderByDispatchAndReturn: false
  suggestedOrder: true                        # override cliente (global=false)
  requiredCollectionAttachments: true
  requiredComment: true
  validateReturn: false
  signatureReturn: true
  signatureCollection: false
  signatureVisit: false
  userCanUploadFiles: true
  esVendedor: false                           # infoVendedores=false en ambas configs
  enterpriseEnabled: true
  enabledManualRate: false
  cobroPrepago: true
  cobroRetencion: true
  retencion: true
  sizeRetention: 14                           # override cliente (global=0)
  formatRetention: Numeros                    # formatRetention=0 → Numeros
  userCanSelectIGTF: true
  userCanCollectIva: false
  transportRole: false
  userMustActivateGPS: false

