  # ═══════════ TRIAJE WEB 2026-07-30 con QA — corrida globalmp / La Tortuga ═══════════

  - id: COB-WEB-DCTO-CONV-MULTIPLICA
    titulo: "La web multiplica por la tasa la conversión del descuento en vez de dividirla"
    capa: web
    modulo: cobros
    detectado_en: "tag 20"
    estado: arreglado_parcial  # ✅ verificado 2026-08-04 — el fix sirve para registros NUEVOS; los viejos siguen mal
    severidad: alta            # financiero y VISIBLE
    patron: 'descuento.*conversi|conv.*descuento|36\.?894|737\.?880|COB-WEB-DCTO'
    detalle: >-
      Cobros 8352 y 8353, en 7 celdas: cabecera `Monto total descuento conversión`, columna
      `Total dcto. conversion` de `form:documentosPagadosDT` y columna `Monto conversión` de `form:discountsDT`.
      8352 muestra **36.894,00 USD** donde va `0,07` (= 50 × 737,88); 8353 muestra **737.880,00 USD** donde va
      `1,36` (= 1.000 × 737,88). La cabecera se autocontradice: `113,48 − 36.894,00 ≠ 113,41`.
      **La web NO recalcula al vuelo: pinta el dato crudo del servidor.** En el móvil el mismo dato existe pero
      es inocuo (no hay pantalla que lo muestre).
    causa_raiz: >-
      `convertirMonto()` (`collection-logic.service.ts:2286-2299`) recibe la moneda **del documento** (rama que
      multiplica) en vez de la **del cobro**. Se dispara **cuando el documento fue EDITADO** (descuento,
      retención o pago parcial) — pagar el saldo completo sin tocar nada graba bien (por eso 8356 está limpio).
    # ═══ COMENTARIO PARA PASARLE AL EQUIPO CUANDO TOMEN EL CASO ═══
    # (QA lo entrega aparte, no forma parte del reporte inicial del defecto)
    comentario_para_desarrollo: |
      Además de la celda visible del descuento, hay un SEGUNDO campo que se corrompe por la MISMA causa:

        `nu_amount_paid_conversion`  — la conversión del monto pagado por documento.

      Se guarda MULTIPLICADO por la tasa en vez de dividido, en los mismos cobros (los que tienen el
      documento editado: descuento, retención o pago parcial). Ejemplo real, cobro 8352, documento 037245:
      pagado 83.684,62 BS → el campo guarda 61.749.207,41 cuando lo correcto sería 113,41.

      Hoy NO se ve en ninguna pantalla —ni en la app ni en la web— porque la tabla de documentos no tiene
      una columna para ese dato. Pero:
        1) el valor corrupto YA está viajando al servidor y quedando persistido, y
        2) existe una ruta que lo leería: `resolvePersistedNetAmountSumConversion`
           (collection-logic.service.ts:1413-1418) usa el valor almacenado cuando `inPaymentPartial === true`.
           El cobro 8355 es exactamente ese caso; hoy no aflora sólo porque gana el cálculo de la cabecera.

      Por eso conviene arreglar `convertirMonto()` DE RAÍZ (que reciba la moneda del cobro y no la del
      documento) en vez de corregir únicamente la celda del descuento: con el arreglo de raíz los dos campos
      quedan resueltos; si sólo se toca el descuento, éste sigue guardándose mal y la ruta latente queda viva.
    verificado_20260804: >-
