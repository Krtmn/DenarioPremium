  - id: CLT-LISTA-SALDOS-CRUZADOS
    titulo: "El listado de clientes cruza las etiquetas de saldo y divide de más (deuda ~738× más chica)"
    capa: movil
    modulo: clientes
    detectado_en: "tag 20"
    estado: reportado          # ✅ QA lo reportó a desarrollo el 2026-07-30 — esperando respuesta
    severidad: alta            # financiero y visible: el vendedor ve la cartera subestimada
    patron: 'saldo.*cruzad|etiqueta.*saldo|738|deuda.*subestim|CLT-LISTA-SALDOS'
    detalle: >-
      En el LISTADO de clientes, lo rotulado "Saldo BS" es en realidad el importe en USD, y lo rotulado
      "Saldo USD" es ese importe dividido otra vez por la tasa ⇒ la deuda se ve ~738× más chica.
      Cliente AS04: lista `USD 2,84 / BS 2.096,23` vs detalle `USD 2.096,23 / BS 1.546.766,19`.
      Triangulado contra documentos: un solo documento de CB10 arrastra 22,24 USD, así que el 0,62 USD de la
      lista es imposible. **El DETALLE está correcto; solo falla el listado.**
      La web NO lo reproduce (muestra un único `Balance = 2.096,23`) ⇒ es de la app.
    verificado_20260803: >-
      🔴 **EL FIX NO CORRIGIÓ EL DEFECTO Y EMPEORÓ LA SITUACIÓN — TARJETA DEVUELTA (03/08/2026).**
      No corrigieron el listado: **alinearon el DETALLE al listado roto**. Hoy las dos pantallas coinciden,
      pero **coinciden en el valor equivocado** ⇒ **ya no queda ninguna pantalla donde consultar el saldo real**
      (antes el detalle era confiable).
      Cliente AS04: listado idéntico al 30/07 (`USD 2,84 / BS 2.096,23`) y el detalle pasó de
      `USD 2.096,23 / BS 1.546.766,19` (correcto) a `BS 2.096,23 / USD 2,84` (incorrecto).
      Verificado en **4 clientes por UI** y **11/11 contra la BD local**. Tasa sin cambios (737,88) y saldos sin
      movimientos desde el 30/07 ⇒ la comparación es limpia.
    tres_evidencias_para_el_reporte: >-
      QA reunió **tres fuentes independientes que dan 2.096,23** (el saldo real en USD) frente a **una sola**
      que dice otra cosa (la línea de "Saldo"):
      1. **Suma de los documentos** de la pestaña Documentos de Venta del propio detalle → 2.096,23
      2. **`Crédito USD − Crédito Disponible USD`** en la misma pantalla → 2.096,23
         ⇒ el motor de crédito SÍ usa el saldo correcto mientras la línea de "Saldo" muestra otro.
      3. **BD nube** (`SUM(document_sale.nu_balance)` del cliente AS04, **empresa 00002**) → **2.096,23**
         ⚠ Filtrar por empresa es imprescindible: sumando las dos empresas del grupo da 4.956,99 y no es el
         número comparable (la pantalla verificada estaba en 00002).
    leccion_de_criterio: >-
      🔑 **El criterio de aceptación "listado y detalle coinciden" es INSUFICIENTE** — es exactamente lo que
      dejó pasar este fix. Hay que anclar contra **la tasa y la BD**, nunca contra la otra pantalla.
    accion: >-
      **TARJETA DEVUELTA el 03/08/2026** con las 3 evidencias y capturas. Re-validar cuando vuelva.

